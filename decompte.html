<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de temps</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #111111;
      --text-color: #ffffff;
      --text-dim: #888888;
      --accent: #ff8c00;
      --border-color: #222222;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100dvh;
      padding: 20px;
    }

    .card {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      border: 1px solid rgba(255, 140, 0, 0.25);
      width: 100%;
      max-width: 420px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="number"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background-color: #1c1c1c;
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
    }

    .result-box {
      margin-top: 20px;
      padding: 15px;
      background-color: #141414;
      border-left: 4px solid var(--accent);
      border-radius: 6px;
    }

    .result-box p {
      margin-bottom: 5px;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .result-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    .error {
      border-left-color: #ff4444;
    }

    .error .result-value {
      color: #ff4444;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="form-group">
      <label for="nombreRestant">Nombre restant :</label>
      <input type="number" id="nombreRestant" placeholder="Ex: 10" min="2" step="1" oninput="redemarrerTimer()">
    </div>

    <div id="resultatContainer" class="result-box" style="display: none;">
      <p>Temps disponible par unité :</p>
      <div id="resultatText" class="result-value"></div>
    </div>
  </div>

  <script>
    let timerId = null;

    function redemarrerTimer() {
      if (timerId) {
        clearInterval(timerId);
      }
      calculerTemps();
      timerId = setInterval(calculerTemps, 1000);
    }

    function calculerTemps() {
      const inputEl = document.getElementById('nombreRestant');
      const inputVal = parseFloat(inputEl.value);
      const container = document.getElementById('resultatContainer');
      const textDiv = document.getElementById('resultatText');

      if (inputEl.value === "") {
        container.style.display = 'none';
        return;
      }

      container.style.display = 'block';

      if (isNaN(inputVal)) {
        container.className = 'result-box error';
        textDiv.textContent = "Veuillez entrer un nombre valide.";
        return;
      }

      // Le diviseur est (nombre restant - 1)
      const diviseur = inputVal - 1;

      if (diviseur <= 0) {
        container.className = 'result-box error';
        textDiv.textContent = "Le nombre doit être supérieur à 1.";
        return;
      }

      const maintenant = new Date();
      const prochaineHeureCible = new Date();

      prochaineHeureCible.setHours(7, 0, 0, 0);

      if (maintenant >= prochaineHeureCible) {
        prochaineHeureCible.setDate(prochaineHeureCible.getDate() + 1);
      }

      const tempsRestantMs = prochaineHeureCible - maintenant;
      const tempsParUniteMs = tempsRestantMs / diviseur;

      const secondesTotales = Math.floor(tempsParUniteMs / 1000);
      const heures = Math.floor(secondesTotales / 3600);
      const minutes = Math.floor((secondesTotales % 3600) / 60);
      const secondes = secondesTotales % 60;

      let resultatFormatted = "";

      if (heures > 0) {
        resultatFormatted = `${heures}h ${minutes}m ${secondes}s`;
      } else if (minutes > 0) {
        resultatFormatted = `${minutes}m ${secondes}s`;
      } else {
        resultatFormatted = `${secondes}s`;
      }

      container.className = 'result-box';
      textDiv.textContent = resultatFormatted;
    }
  </script>

</body>
</html>
