<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrôle éclairage — Bâtiment 1</title>
<style>
  :root{
    --bg: #000000;
    --card-bg: #0b0b0b;
    --border: #222222;
    --cell-bg: #1a1a1a;
    --cell-border: #444444;
    --cell-hover: #262626;
    --accent: #ff8c00;
    --nc: #ef4444;
    --hs: #050505;
    --ok: #22c55e;
    --muted: #9aa0a6;
  }
  *{box-sizing:border-box;}
  html, body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:#ffffff;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    padding:10px 12px;
    overflow:hidden;
    height:100vh;
  }
  @supports (height: 100dvh){
    body{ height:100dvh; }
  }
  .app{
    max-width:720px;
    margin:0 auto;
    height:100%;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  /* --- EN-TÊTE (identique au thème IS & DM) --- */
  .top-header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }
  .top-header h1{
    font-size:clamp(0.8rem, 3.4vw, 1.1rem);
    color:#ffffff;
    font-weight:600;
    letter-spacing:0.02em;
    margin:0;
    white-space:nowrap;
  }
  .header-actions{
    display:flex;
    gap:8px;
  }
  .btn-action{
    background:#000000;
    border:1px solid #333333;
    color:#ffffff;
    padding:6px 12px;
    border-radius:6px;
    font-size:0.8rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:all 0.2s ease;
    white-space:nowrap;
  }
  .btn-action:hover{ border-color:#666; opacity:0.9; }
  .btn-action.btn-reset{ color:var(--muted); }

  /* --- CARTE PRINCIPALE (accueil ou plan de cellule) --- */
  .plan-wrapper{
    flex:1 1 auto;
    min-height:0;
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.7);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }

  /* Écran d'accueil : choix de la cellule */
  .accueil{
    flex:1 1 auto;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-auto-rows:1fr;
    gap:10px;
  }
  .bouton-accueil{
    background:var(--cell-bg);
    border:1px solid var(--cell-border);
    border-radius:8px;
    color:#ffffff;
    font-family:inherit;
    font-size:1.05rem;
    letter-spacing:0.02em;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:all 0.2s ease;
  }
  .bouton-accueil:hover, .bouton-accueil:active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--cell-hover);
  }

  /* Vue plan d'une cellule */
  .zone-plan{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
  }
  .barre-nav{
    flex:0 0 auto;
    display:flex;
    margin-bottom:8px;
  }

  .zone-cellules{
    flex:1 1 auto;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
  }

  /* Plan / cellules */
  .cellule{
    display:none;
    background:transparent;
    padding:4px;
    width:100%;
    max-width:640px;
  }
  .cellule.actif{
    display:flex;
    flex-direction:column;
    max-width:100%;
    max-height:100%;
    margin:auto;
    animation: glisser 0.28s ease;
  }
  @keyframes glisser{
    from{ opacity:0; transform:translateX(18px); }
    to{ opacity:1; transform:translateX(0); }
  }
  .cellule h2{
    flex:0 0 auto;
    font-size:0.85rem;
    text-align:center;
    color:var(--accent);
    margin:0 0 6px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:700;
  }
  .zone-titre{
    flex:0 0 auto;
    font-size:0.62rem;
    color:var(--muted);
    text-align:center;
    margin:4px 0;
    text-transform:uppercase;
    letter-spacing:0.08em;
  }
  .grille-stockage{
    flex:5 1 0;
    min-height:0;
    display:grid;
    gap:3px;
  }
  .grille-quai{
    flex:4 1 0;
    min-height:0;
    display:grid;
    gap:3px;
    background:var(--hs);
    border:1px solid var(--border);
    padding:5px;
    border-radius:5px;
  }
  .lampe{
    position:relative;
    border-radius:4px;
    background:var(--cell-bg);
    border:1px solid var(--cell-border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(8px, 2.2vh, 14px);
    font-weight:700;
    color:#ffffff;
    cursor:pointer;
    user-select:none;
    overflow:hidden;
    transition:background .12s, border-color .12s;
  }
  .lampe:hover{ border-color:var(--accent); }
  .lampe.nc{ background:var(--nc); border-color:var(--nc); color:#2a0505; }
  .lampe.hs{ background:var(--hs); border-color:#000000; color:#333333; }
  .vide{ visibility:hidden; }
  .num{
    position:absolute;
    top:1px;
    left:2px;
    font-size:clamp(6px, 1vh, 9px);
    font-weight:400;
    color:#5a6270;
    pointer-events:none;
  }
  .lampe.nc .num{ color:rgba(0,0,0,0.4); }
  .lampe.hs .num{ color:#2a2a2a; }

  .flux{
    flex:0 0 auto;
    text-align:center;
    font-size:0.58rem;
    color:var(--muted);
    margin-top:4px;
    letter-spacing:0.1em;
  }

  /* Stats sous le plan */
  .stats{
    flex:0 0 auto;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .stat{
    background:var(--cell-bg);
    border:1px solid var(--cell-border);
    border-radius:6px;
    padding:5px 10px;
    font-size:0.7rem;
    min-width:90px;
    text-align:center;
    color:var(--muted);
  }
  .stat b{display:block;font-size:1rem;letter-spacing:0.02em;color:#fff;}
  .stat.ok b{color:var(--ok);}
  .stat.nc b{color:var(--nc);}
  .stat.off b{color:var(--muted);}

  /* Fenêtre Modale du Compte Rendu */
  .modal{
    display:none;
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0.8);
    z-index:100;
    justify-content:center;
    align-items:center;
    padding:16px;
  }
  .modal-contenu{
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:10px;
    max-width:600px;
    width:100%;
    max-height:90vh;
    overflow-y:auto;
    padding:18px;
    color:#ffffff;
    box-shadow:0 10px 30px rgba(0,0,0,0.8);
  }
  .cr-emojis{
    font-family: "JetBrains Mono", Consolas, monospace;
    white-space: pre-wrap;
    font-size: 0.85rem;
    line-height: 1.4;
    color:#dddddd;
  }
  .modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
    padding-bottom:10px;
    border-bottom:1px solid var(--border);
  }
  .modal-header h3{
    margin:0;
    font-size:0.95rem;
    color:#ffffff;
    font-weight:700;
  }
  .close-x{
    background:transparent;
    border:none;
    color:#ffffff;
    font-size:1.2rem;
    line-height:1;
    padding:4px 8px;
    cursor:pointer;
  }
  .close-x:hover{ color:var(--accent); }
  .modal-actions{
    display:flex;
    justify-content:flex-end;
    margin-top:16px;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn-copy, .btn-share{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 14px;
    border-radius:6px;
    font-family:inherit;
    font-size:0.85rem;
    font-weight:600;
    cursor:pointer;
  }
  .btn-copy{
    background:#2a2a2a;
    color:#ffffff;
    border:1px solid #444444;
  }
  .btn-copy:hover{ background:#333333; }
  .btn-share{
    background:var(--accent);
    color:#000000;
    font-weight:700;
    border:none;
    padding:8px 16px;
    transition: opacity 0.2s;
  }
  .btn-share:hover{ opacity: 0.9; }
</style>
</head>
<body>
<div class="app">

  <div class="top-header">
    <h1>CONTRÔLE — ÉCLAIRAGE B1</h1>
    <div class="header-actions">
      <button id="btnGenerer" class="btn-action">Générer Rapport</button>
      <button id="btnReset" class="btn-action btn-reset">Réinitialiser</button>
    </div>
  </div>

  <div class="plan-wrapper">
    <div class="accueil" id="accueil"></div>

    <div class="zone-plan" id="zonePlan" style="display:none;">
      <div class="barre-nav">
        <button id="btnRetour" class="btn-action">← Cellules</button>
      </div>
      <div class="zone-cellules" id="cellules"></div>
    </div>
  </div>

  <div class="stats" id="statsBar" style="display:none;">
    <div class="stat ok"><b id="cptC">0</b>Conforme (C)</div>
    <div class="stat nc"><b id="cptNC">0</b>Non conforme (NC)</div>
    <div class="stat off"><b id="cptHS">0</b>Neutralisé (noir)</div>
  </div>

</div>

<!-- Fenêtre Modale pour le Compte Rendu -->
<div class="modal" id="modalCR">
  <div class="modal-contenu" id="modalCRContenu">
    <div class="modal-header">
      <h3>Compte rendu — Éclairage B1</h3>
      <button class="close-x" id="btnFermerCR">✕</button>
    </div>
    <div id="crDetails" class="cr-emojis"></div>
    <div class="modal-actions">
      <button class="btn-copy" id="btnCopierCR">📋 Copier</button>
      <button class="btn-share" id="btnPartagerCR">📲 Partager</button>
    </div>
  </div>
</div>

<script>
const states = ['', 'nc', 'hs'];
const labels = ['', 'NC', ''];
const emojis = ['🟩', '🟥', '⬛'];

function creerLampe(numero){
  const div = document.createElement('div');
  div.className = 'lampe';
  div.dataset.state = '0';
  div.dataset.numero = numero;

  const num = document.createElement('span');
  num.className = 'num';
  num.textContent = numero;
  div.appendChild(num);

  const lettre = document.createElement('span');
  lettre.className = 'lettre';
  div.appendChild(lettre);

  div.addEventListener('click', ()=>{
    let s = (parseInt(div.dataset.state) + 1) % 3;
    div.dataset.state = s;
    div.className = 'lampe' + (states[s] ? ' ' + states[s] : '');
    div.appendChild(num);
    lettre.textContent = labels[s];
    div.appendChild(lettre);
    updateStats();
  });
  return div;
}

function creerVide(){
  const div = document.createElement('div');
  div.className = 'vide';
  return div;
}

function creerGrilleStockage(cols, rows, offset, extraGauche){
  const g = document.createElement('div');
  g.className = 'grille-stockage';
  g.dataset.cols = extraGauche ? cols + 1 : cols;
  g.dataset.rows = rows;
  g.style.gridTemplateColumns = `repeat(${extraGauche ? cols+1 : cols}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  for(let i=0;i<rows;i++){
    if(extraGauche){
      g.appendChild(i===0 ? creerLampe('?') : creerVide());
    }
    for(let j=0;j<cols;j++){
      const c = j+1;
      const r = rows - i;
      const numero = (c-1)*rows + r + offset;
      g.appendChild(creerLampe(numero));
    }
  }
  return g;
}

function creerGrilleQuai(cols, rows, extraDroite){
  const g = document.createElement('div');
  g.className = 'grille-quai';
  g.dataset.cols = extraDroite ? cols + 1 : cols;
  g.dataset.rows = rows;
  g.style.gridTemplateColumns = `repeat(${extraDroite ? cols+1 : cols}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  for(let i=0;i<rows;i++){
    for(let j=0;j<cols;j++){
      const c = j+1;
      const r = rows - i;
      const numero = (r-1)*cols + c;
      g.appendChild(creerLampe(numero));
    }
    if(extraDroite){
      g.appendChild(i===0 ? creerLampe('?') : creerVide());
    }
  }
  return g;
}

const conteneurCellules = document.getElementById('cellules');
const conteneurAccueil = document.getElementById('accueil');
const zonePlan = document.getElementById('zonePlan');
const accueil = document.getElementById('accueil');

const statsBar = document.getElementById('statsBar');
const ordreCellules = ['1','2','3','4','5','6','DH'];

function retournerAccueil(){
  zonePlan.style.display = 'none';
  statsBar.style.display = 'none';
  accueil.style.display = 'grid';
}

function afficherCellule(id){
  accueil.style.display = 'none';
  zonePlan.style.display = 'flex';
  statsBar.style.display = 'flex';
  document.querySelectorAll('.cellule').forEach(c=>c.classList.remove('actif'));
  document.getElementById('cellule-'+id).classList.add('actif');
  ajusterTaille();
}

document.getElementById('btnRetour').addEventListener('click', retournerAccueil);

function ajouterBoutonAccueil(id, libelle){
  const bouton = document.createElement('button');
  bouton.className = 'bouton-accueil';
  bouton.textContent = libelle;
  bouton.addEventListener('click', ()=> afficherCellule(id));
  conteneurAccueil.appendChild(bouton);
}

// Cellules 1 à 6
const definitionsCellules = [1,2,3,4,5,6];
definitionsCellules.forEach((id, index)=>{
  const cell = document.createElement('div');
  cell.className = 'cellule';
  cell.id = 'cellule-' + id;

  const titre = document.createElement('h2');
  titre.textContent = 'Cellule ' + id;
  cell.appendChild(titre);

  const titreStock = document.createElement('div');
  titreStock.className = 'zone-titre';
  titreStock.textContent = 'Stockage';
  cell.appendChild(titreStock);
  cell.appendChild(creerGrilleStockage(10, 5, 0, false));

  const titreQuai = document.createElement('div');
  titreQuai.className = 'zone-titre';
  titreQuai.textContent = 'Quai';
  cell.appendChild(titreQuai);
  cell.appendChild(creerGrilleQuai(9, 4, id===6));

  const flux = document.createElement('div');
  flux.className = 'flux';
  flux.textContent = '↓ sens des quais ↓';
  cell.appendChild(flux);

  conteneurCellules.appendChild(cell);
  ajouterBoutonAccueil(id, 'Cellule ' + id);
});

// Cellule D+H
const cellDH = document.createElement('div');
cellDH.className = 'cellule';
cellDH.id = 'cellule-DH';

const titreDH = document.createElement('h2');
titreDH.textContent = 'Cellules D + H';
cellDH.appendChild(titreDH);

const titreH = document.createElement('div');
titreH.className = 'zone-titre';
titreH.textContent = 'Stockage H';
cellDH.appendChild(titreH);
const grilleH = creerGrilleStockage(10, 2, 70, false);
grilleH.style.flex = '2 1 0';
cellDH.appendChild(grilleH);

const titreD = document.createElement('div');
titreD.className = 'zone-titre';
titreD.textContent = 'Stockage D';
cellDH.appendChild(titreD);
const grilleD = creerGrilleStockage(10, 2, 50, false);
grilleD.style.flex = '2 1 0';
cellDH.appendChild(grilleD);

const remplissage = document.createElement('div');
remplissage.style.flex = '5 1 0';
cellDH.appendChild(remplissage);

conteneurCellules.appendChild(cellDH);
ajouterBoutonAccueil('DH', 'Cellules D+H');

function updateStats(){
  const total = { c:0, nc:0, hs:0 };
  document.querySelectorAll('.lampe').forEach(l=>{
    const s = l.dataset.state;
    if(s==='0') total.c++;
    else if(s==='1') total.nc++;
    else if(s==='2') total.hs++;
  });
  document.getElementById('cptC').textContent = total.c;
  document.getElementById('cptNC').textContent = total.nc;
  document.getElementById('cptHS').textContent = total.hs;
}

// Lampes neutralisées par défaut
const etatsInitiaux = {
  1: [28,29],
  2: [31],
  3: [27],
  4: [2,10,11,12,13],
  5: [31]
};
function appliquerEtatsInitiaux(){
  Object.keys(etatsInitiaux).forEach(id=>{
    const cell = document.getElementById('cellule-'+id);
    etatsInitiaux[id].forEach(numero=>{
      const lampe = cell.querySelector('.grille-quai .lampe[data-numero="'+numero+'"]');
      if(lampe){
        lampe.dataset.state = '2';
        lampe.className = 'lampe hs';
        const lettre = lampe.querySelector('.lettre');
        if(lettre) lettre.textContent = '';
      }
    });
  });
}
appliquerEtatsInitiaux();
updateStats();

// Calcul adaptatif des dimensions
const RATIO = 10/9;
function ajusterTaille(){
  const conteneur = document.getElementById('cellules');
  const w = conteneur.clientWidth;
  const h = conteneur.clientHeight;
  let cibleW, cibleH;
  if (w <= h){
    cibleW = w;
    cibleH = h;
  } else if (w / h > RATIO){
    cibleH = h;
    cibleW = h * RATIO;
  } else {
    cibleW = w;
    cibleH = w / RATIO;
  }
  document.querySelectorAll('.cellule').forEach(c=>{
    c.style.width = cibleW + 'px';
    c.style.height = cibleH + 'px';
  });
}
window.addEventListener('resize', ajusterTaille);
window.addEventListener('orientationchange', ()=> setTimeout(ajusterTaille, 150));
ajusterTaille();

/* Réinitialisation complète */
function resetAll(){
  if(!confirm('Réinitialiser tous les contrôles d\'éclairage ?')) return;
  document.querySelectorAll('.lampe').forEach(l=>{
    l.dataset.state = '0';
    l.className = 'lampe';
    const lettre = l.querySelector('.lettre');
    if(lettre) lettre.textContent = '';
  });
  appliquerEtatsInitiaux();
  updateStats();
  retournerAccueil();
}
document.getElementById('btnReset').addEventListener('click', resetAll);

/* Génération du Schéma d'Emojis pour une grille */
function genererGrilleEmojis(grilleEl) {
  const cols = parseInt(grilleEl.dataset.cols);
  const enfants = Array.from(grilleEl.children);
  let texte = '';
  let ligneActuelle = '';

  enfants.forEach((item, index) => {
    if (item.classList.contains('lampe')) {
      const state = parseInt(item.dataset.state || '0');
      ligneActuelle += emojis[state] + ' ';
    } else if (item.classList.contains('vide')) {
      ligneActuelle += '   ';
    }

    if ((index + 1) % cols === 0) {
      texte += ligneActuelle.trimEnd() + '\n';
      ligneActuelle = '';
    }
  });
  return texte;
}

/* Formatage de la date en JJ/MM/AAAA HH:MM:SS */
function obtenirDateFormatee() {
  const maintenant = new Date();
  const pad = (n) => String(n).padStart(2, '0');
  const date = `${pad(maintenant.getDate())}/${pad(maintenant.getMonth() + 1)}/${maintenant.getFullYear()}`;
  const heure = `${pad(maintenant.getHours())}:${pad(maintenant.getMinutes())}:${pad(maintenant.getSeconds())}`;
  return `${date} ${heure}`;
}

/* Génération du Compte-Rendu Visuel */
const modalCR = document.getElementById('modalCR');
const btnFermerCR = document.getElementById('btnFermerCR');
const btnCopierCR = document.getElementById('btnCopierCR');
const crDetails = document.getElementById('crDetails');

document.getElementById('btnGenerer').addEventListener('click', ()=>{
  let texte = `Compte rendu — Eclairage B1\n`;
  texte += `Généré le : ${obtenirDateFormatee()}\n`;
  texte += `--------------------------------------------\n`;
  texte += `Légende : 🟩 Conforme   🟥 Non Conforme   ⬛ Neutralisé\n`;
  texte += `--------------------------------------------\n\n`;

  ordreCellules.forEach(id=>{
    const cell = document.getElementById('cellule-'+id);
    texte += `---\nCELLULE ${id==='DH'?'D+H':id}\n`;

    const grillesStockage = cell.querySelectorAll('.grille-stockage');
    const grilleQuai = cell.querySelector('.grille-quai');

    if(grillesStockage.length === 1) {
      texte += `[ STOCKAGE ]\n`;
      texte += genererGrilleEmojis(grillesStockage[0]);
    } else if(grillesStockage.length > 1) {
      texte += `[ STOCKAGE H ]\n`;
      texte += genererGrilleEmojis(grillesStockage[0]);
      texte += `---\n[ STOCKAGE D ]\n`;
      texte += genererGrilleEmojis(grillesStockage[1]);
    }

    if(grilleQuai) {
      texte += `[ QUAI ]\n`;
      texte += genererGrilleEmojis(grilleQuai);
    }

    texte += `\n`;
  });

  crDetails.textContent = texte.trim();
  modalCR.style.display = 'flex';
});

function fermerModalCR(){
  modalCR.style.display = 'none';
}
btnFermerCR.addEventListener('click', fermerModalCR);
modalCR.addEventListener('click', (e)=>{
  if(e.target === modalCR) fermerModalCR();
});
document.getElementById('modalCRContenu').addEventListener('click', (e)=> e.stopPropagation());

/* Copie du contenu du compte-rendu */
btnCopierCR.addEventListener('click', ()=>{
  const texte = crDetails.textContent;
  navigator.clipboard.writeText(texte).then(() => {
    const texteOrigine = btnCopierCR.innerHTML;
    btnCopierCR.innerHTML = '✓ Copié !';
    setTimeout(() => {
      btnCopierCR.innerHTML = texteOrigine;
    }, 2000);
  }).catch(err => {
    alert('Erreur lors de la copie du texte.');
    console.error(err);
  });
});

/* Partage du compte-rendu (natif si disponible, sinon copie de secours) */
const btnPartagerCR = document.getElementById('btnPartagerCR');
btnPartagerCR.addEventListener('click', async ()=>{
  const texte = crDetails.textContent;
  if (navigator.share) {
    try {
      await navigator.share({ title: 'Compte rendu — Éclairage B1', text: texte });
    } catch (err) {
      if (err.name !== 'AbortError') console.error('Erreur de partage :', err);
    }
  } else {
    try {
      await navigator.clipboard.writeText(texte);
      const texteOrigine = btnPartagerCR.innerHTML;
      btnPartagerCR.innerHTML = '✓ Copié (partage indisponible)';
      setTimeout(() => { btnPartagerCR.innerHTML = texteOrigine; }, 2000);
    } catch (e) {
      alert('Partage non pris en charge sur ce navigateur.');
    }
  }
});
</script>
</body>
</html>
