<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur de Web-Radios</title>
<style>
    :root {
        --bg-color: #000000;
        --card-bg: #0c0c0c;
        --card-border: #1a1a1a;
        --card-border-hover: #333333;
        --text-color: #ffffff;
        --text-dim: #777777;
        --accent: #ff8c00;
        --vert-status: #22c55e;
    }

    * { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 40px 20px 60px;
        min-height: 100dvh;
        display: flex;
        justify-content: center;
    }

    .page-wrap {
        width: 100%;
        max-width: 800px;
    }

    header {
        margin-bottom: 40px;
        border-bottom: 1px solid var(--card-border);
        padding-bottom: 16px;
    }

    h1 {
        font-size: 1.1rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text-dim);
    }

    /* Carte Lecteur Principal */
    .player-card {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 24px 28px;
        margin-bottom: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        transition: border-color 0.3s ease;
    }

    .player-card.active {
        border-color: rgba(255, 140, 0, 0.4);
    }

    .player-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
    }

    .current-station {
        font-size: 1.3rem;
        font-weight: 600;
        letter-spacing: -0.2px;
    }

    .status-tag {
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--text-dim);
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--text-dim);
        transition: background-color 0.3s ease;
    }

    .status-tag.playing .status-dot {
        background-color: var(--vert-status);
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.6);
    }

    .status-tag.playing {
        color: var(--text-color);
    }

    /* Controls Custom */
    .player-controls {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    /* Égaliseur ultra-épuré */
    .equalizer {
        display: flex;
        align-items: flex-end;
        gap: 3px;
        height: 18px;
        opacity: 0.2;
        transition: opacity 0.3s ease;
    }

    .equalizer.playing {
        opacity: 1;
    }

    .equalizer .bar {
        width: 2px;
        height: 4px;
        background-color: var(--accent);
        border-radius: 1px;
        transition: height 0.2s ease;
    }

    .equalizer.playing .bar {
        animation: bounce 1s infinite ease-in-out alternate;
    }

    .equalizer.playing .bar:nth-child(1) { animation-delay: 0.1s; }
    .equalizer.playing .bar:nth-child(2) { animation-delay: 0.3s; }
    .equalizer.playing .bar:nth-child(3) { animation-delay: 0.2s; }
    .equalizer.playing .bar:nth-child(4) { animation-delay: 0.4s; }

    @keyframes bounce {
        0% { height: 3px; }
        100% { height: 18px; }
    }

    /* Bouton unique Play / Stop */
    .btn-play-stop {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 1px solid var(--card-border-hover);
        background-color: #141414;
        color: var(--text-color);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        outline: none;
    }

    .btn-play-stop:hover {
        border-color: var(--accent);
        color: var(--accent);
        transform: scale(1.04);
    }

    .btn-play-stop svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
    }

    /* Grille des radios */
    .section-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 14px;
    }

    .radio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 12px;
        margin-bottom: 40px;
    }

    .radio-bloc {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 10px;
        padding: 16px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
    }

    .radio-bloc:hover {
        border-color: var(--card-border-hover);
        background-color: #111111;
    }

    .radio-bloc.active {
        border-color: var(--accent);
        background-color: rgba(255, 140, 0, 0.04);
    }

    .radio-bloc .nom {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-color);
        margin-bottom: 3px;
    }

    .radio-bloc.active .nom {
        color: var(--accent);
    }

    .radio-bloc .genre {
        font-size: 0.7rem;
        color: var(--text-dim);
    }

    /* Puce lumineuse sur carte active */
    .radio-bloc .active-indicator {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: var(--accent);
        display: none;
    }

    .radio-bloc.active .active-indicator {
        display: block;
    }

    /* Légende footer */
    .legende {
        display: flex;
        align-items: center;
        gap: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--card-border);
    }

    .legende-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--text-dim);
    }

    .legende-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid var(--card-border);
    }

    .legende-dot.active {
        background-color: var(--accent);
        border-color: var(--accent);
    }

    .legende-dot.inactif {
        background-color: var(--card-bg);
    }
</style>
</head>
<body>

<div class="page-wrap">
    <header>
        <h1>Web-Radios</h1>
    </header>

    <!-- Carte du lecteur principal -->
    <div class="player-card" id="playerCard">
        <div class="player-info">
            <div class="current-station" id="stationTitle">Sélectionnez une station</div>
            <div class="status-tag" id="statusTag">
                <span class="status-dot"></span>
                <span id="statusText">Hors ligne</span>
            </div>
        </div>

        <div class="player-controls">
            <!-- Animation barres de son -->
            <div class="equalizer" id="mainEqualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <!-- Bouton unique Play / Stop -->
            <button class="btn-play-stop" id="btnToggle" onclick="togglePlayStop()" title="Lecture / Arrêt">
                <svg id="iconPlay" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="iconStop" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="6" width="12" height="12"/></svg>
            </button>
        </div>
    </div>

    <!-- Element audio masqué -->
    <audio id="audioPlayer"></audio>

    <div class="section-title">Stations</div>
    
    <!-- Grille des radios -->
    <div class="radio-grid" id="radioGrid"></div>

    <div class="legende">
        <div class="legende-item"><div class="legende-dot active"></div>Sélectionnée</div>
        <div class="legende-item"><div class="legende-dot inactif"></div>Disponible</div>
    </div>
</div>

<script>
let stations = [
    { id: 'nostalgie', nom: 'Nostalgie', url: 'https://streaming.nrjaudio.fm/oug7girb92oc', genre: 'Variété' },
    { id: 'nrj', nom: 'NRJ', url: 'https://streaming.nrjaudio.fm/oumvmk8fnozc', genre: 'Hits' },
    { id: 'europe2', nom: 'Europe 2', url: 'https://europe2.lmn.fm/europe2.mp3', genre: 'Pop / Rock' },
    { id: 'cheriefm', nom: 'Chérie FM', url: 'https://streaming.nrjaudio.fm/ouuku85n3nje', genre: 'Pop' },
    { id: 'skyrock', nom: 'Skyrock', url: 'https://icecast.skyrock.net/s/natio_mp3_128k', genre: 'Urban' }
];

// Tri par ordre alphabétique
stations.sort((a, b) => a.nom.localeCompare(b.nom));

const audioPlayer = document.getElementById('audioPlayer');
const stationTitle = document.getElementById('stationTitle');
const statusTag = document.getElementById('statusTag');
const statusText = document.getElementById('statusText');
const radioGrid = document.getElementById('radioGrid');
const iconPlay = document.getElementById('iconPlay');
const iconStop = document.getElementById('iconStop');
const mainEqualizer = document.getElementById('mainEqualizer');
const playerCard = document.getElementById('playerCard');

let currentStationId = null;

function chargerRadios() {
    radioGrid.innerHTML = stations.map(s => `
        <div class="radio-bloc" id="card-${s.id}" onclick="selectAndPlay('${s.id}')">
            <div class="active-indicator"></div>
            <span class="nom">${s.nom}</span>
            <span class="genre">${s.genre}</span>
        </div>
    `).join('');
}

function selectAndPlay(id) {
    const station = stations.find(s => s.id === id);
    if (!station) return;

    currentStationId = id;

    // Mise à jour de la grille
    document.querySelectorAll('.radio-bloc').forEach(el => el.classList.remove('active'));
    document.getElementById(`card-${id}`).classList.add('active');

    // Mise à jour du lecteur
    stationTitle.innerText = station.nom;
    audioPlayer.src = station.url;
    audioPlayer.load();

    playAudio();
}

function playAudio() {
    if (!audioPlayer.src) return;

    const playPromise = audioPlayer.play();
    if (playPromise !== undefined) {
        playPromise.then(() => {
            updateUI(true);
        }).catch(error => {
            console.error("Erreur de lecture :", error);
            statusText.innerText = 'Indisponible';
            updateUI(false);
        });
    }
}

function stopAudio() {
    audioPlayer.pause();
    audioPlayer.currentTime = 0;
    audioPlayer.src = ""; // Coupe le flux
    updateUI(false);
}

function togglePlayStop() {
    if (!currentStationId) {
        selectAndPlay(stations[0].id);
        return;
    }

    if (audioPlayer.paused || !audioPlayer.src) {
        const station = stations.find(s => s.id === currentStationId);
        if (station) {
            audioPlayer.src = station.url;
            audioPlayer.load();
            playAudio();
        }
    } else {
        stopAudio();
    }
}

function updateUI(isPlaying) {
    if (isPlaying) {
        statusText.innerText = 'En direct';
        statusTag.classList.add('playing');
        playerCard.classList.add('active');
        iconPlay.style.display = 'none';
        iconStop.style.display = 'block';
        mainEqualizer.classList.add('playing');
    } else {
        statusText.innerText = audioPlayer.src ? 'En pause' : 'Hors ligne';
        statusTag.classList.remove('playing');
        playerCard.classList.remove('active');
        iconPlay.style.display = 'block';
        iconStop.style.display = 'none';
        mainEqualizer.classList.remove('playing');
    }
}

audioPlayer.addEventListener('play', () => updateUI(true));
audioPlayer.addEventListener('pause', () => updateUI(false));

chargerRadios();
</script>

</body>
</html>
