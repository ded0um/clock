<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lecteur de Web-Radios</title>
<style>
    :root {
        --bg-color: #000000;
        --card-bg: #111111;
        --card-border: #2a2a2a;
        --text-color: #ffffff;
        --text-dim: #888888;
        --accent: #ff8c00;
        --vert-status: #22c55e;
        --rouge-live: #ff4444;
        --bleu-btn: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        padding: 30px 20px 60px;
        min-height: 100dvh;
    }
    .page-wrap {
        max-width: 1000px;
        margin: 0 auto;
    }
    h1 {
        font-size: 1.4rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: var(--text-dim);
        margin-bottom: 30px;
        border-bottom: 1px solid rgba(255, 140, 0, 0.25);
        padding-bottom: 15px;
    }
    
    /* Section Lecteur Principal */
    .player-card {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 30px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }
    
    .player-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    
    .current-station {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--accent);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .status-tag {
        font-size: 0.7rem;
        font-weight: bold;
        padding: 4px 8px;
        border-radius: 4px;
        text-transform: uppercase;
        background-color: rgba(136, 136, 136, 0.1);
        color: var(--text-dim);
        border: 1px solid var(--card-border);
    }

    .status-tag.playing {
        background-color: rgba(34, 197, 94, 0.1);
        color: var(--vert-status);
        border-color: rgba(34, 197, 94, 0.4);
    }

    audio {
        width: 100%;
        height: 45px;
        border-radius: 6px;
        outline: none;
    }

    /* Grille des radios */
    .section-title {
        font-size: 0.9rem;
        font-weight: bold;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 12px;
    }

    .radio-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 10px;
        margin-bottom: 30px;
    }

    .radio-bloc {
        background-color: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        padding: 15px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .radio-bloc:hover {
        border-color: var(--accent);
        background-color: rgba(255, 140, 0, 0.05);
    }

    .radio-bloc.active {
        background-color: rgba(255, 140, 0, 0.12);
        border-color: var(--accent);
    }

    .radio-bloc .num {
        font-size: 1rem;
        font-weight: bold;
        color: var(--text-color);
        margin-bottom: 4px;
    }

    .radio-bloc.active .num {
        color: var(--accent);
    }

    .radio-bloc .lbl {
        font-size: 0.65rem;
        color: var(--text-dim);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    /* Légende footer */
    .legende {
        margin-top: 40px;
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        padding-top: 20px;
        border-top: 1px solid #1e1e1e;
    }
    .legende-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.8rem;
        color: var(--text-dim);
    }
    .legende-puce {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        flex-shrink: 0;
        border: 1px solid #2a2a2a;
    }
    .legende-puce.active { background-color: rgba(255, 140, 0, 0.15); border-color: var(--accent); }
    .legende-puce.inactif { background-color: var(--card-bg); }
</style>
</head>
<body>

<div class="page-wrap">
    <h1>Lecteur Radio en Direct</h1>

    <!-- Carte du lecteur principal -->
    <div class="player-card">
        <div class="player-header">
            <div class="current-station" id="stationTitle">Sélectionnez une station</div>
            <div class="status-tag" id="statusTag">Hors ligne</div>
        </div>
        <audio id="audioPlayer" controls src=""></audio>
    </div>

    <div class="section-title">Stations disponibles</div>
    
    <!-- Grille des radios -->
    <div class="radio-grid" id="radioGrid"></div>

    <div class="legende">
        <div class="legende-item"><div class="legende-puce active"></div>Station sélectionnée</div>
        <div class="legende-item"><div class="legende-puce inactif"></div>Station disponible</div>
    </div>
</div>

<script>
const stations = [
    { id: 'nostalgie', nom: 'Nostalgie', url: 'https://streaming.nrjaudio.fm/oug7girb92oc', genre: 'Variété / Oldies' },
    { id: 'nrj', nom: 'NRJ', url: 'https://streaming.nrjaudio.fm/oumvmk8fnozc', genre: 'Hits / Pop' },
    { id: 'europe2', nom: 'Europe 2', url: 'https://europe2.lmn.fm/europe2.mp3', genre: 'Pop / Rock' },
    { id: 'cheriefm', nom: 'Chérie FM', url: 'https://streaming.nrjaudio.fm/ouuku85n3nje', genre: 'Pop / Love' },
    { id: 'skyrock', nom: 'Skyrock', url: 'https://icecast.skyrock.net/s/natio_mp3_128k', genre: 'Rap / R&B' }
];

const audioPlayer = document.getElementById('audioPlayer');
const stationTitle = document.getElementById('stationTitle');
const statusTag = document.getElementById('statusTag');
const radioGrid = document.getElementById('radioGrid');

function chargerRadios() {
    radioGrid.innerHTML = stations.map(s => `
        <div class="radio-bloc" id="card-${s.id}" onclick="playRadio('${s.id}')">
            <span class="num">${s.nom}</span>
            <span class="lbl">${s.genre}</span>
        </div>
    `).join('');
}

function playRadio(id) {
    const station = stations.find(s => s.id === id);
    if (!station) return;

    // Mise à jour de la sélection visuelle
    document.querySelectorAll('.radio-bloc').forEach(el => el.classList.remove('active'));
    document.getElementById(`card-${id}`).classList.add('active');

    // Mise à jour du lecteur
    stationTitle.innerText = station.nom;
    audioPlayer.src = station.url;
    audioPlayer.load();
    
    // Lancement de la lecture avec gestion des erreurs
    const playPromise = audioPlayer.play();
    if (playPromise !== undefined) {
        playPromise.then(() => {
            statusTag.innerText = 'En direct';
            statusTag.classList.add('playing');
        }).catch(error => {
            console.error("Erreur de lecture :", error);
            statusTag.innerText = 'Erreur / Bloqué';
            statusTag.classList.remove('playing');
        });
    }
}

// Gestion des évènements du lecteur audio
audioPlayer.addEventListener('pause', () => {
    statusTag.innerText = 'En pause';
    statusTag.classList.remove('playing');
});

audioPlayer.addEventListener('play', () => {
    statusTag.innerText = 'En direct';
    statusTag.classList.add('playing');
});

// Initialisation de la grille au chargement
chargerRadios();
</script>

</body>
</html>
