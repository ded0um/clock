<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YT sans Pub</title>
  <meta name="description" content="Collez un lien YouTube et regardez sans publicité." />
  <meta name="theme-color" content="#000000" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000000;
      color: #eee;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      cursor: default;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    p {
      text-align: center;
      font-size: 1.1rem;
      color: #aaa;
      margin-bottom: 1.25rem;
    }

    input {
      width: 100%;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      margin-bottom: 1.5rem;
      caret-color: transparent;
      -webkit-appearance: none;
      appearance: none;
    }

    input:focus {
      border-color: #ff8c00;
      caret-color: #ff8c00;
    }

    input::placeholder {
      color: #555;
    }

    .player {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .player.active {
      display: block;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <p>YT sans pub</p>
    <input type="text" id="url" placeholder="https://www.youtube.com/..." />
    <div class="player" id="player">
      <iframe id="frame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    </div>
  </div>

  <script>
    const input = document.getElementById('url');
    const player = document.getElementById('player');
    const frame = document.getElementById('frame');

    function extractId(url) {
      if (!url) return null;
      url = url.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
      const match = url.match(/(?:youtube\.com\/(?:watch\?.*v=|embed\/|shorts\/|live\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    function play() {
      const id = extractId(input.value);
      if (!id) return;
      frame.src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0`;
      player.classList.add('active');
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') play();
    });

    input.addEventListener('paste', () => {
      setTimeout(play, 10);
    });

    // Support ?v=ID in URL
    const params = new URLSearchParams(location.search);
    const v = params.get('v');
    if (v) {
      input.value = v;
      play();
    }
  </script>
</body>
</html>
