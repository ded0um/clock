<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contrôles — Calles & Chandelles</title>
<style>
:root{
  --bg:#000;
  --card:#0b0b0b;
  --muted:#9aa0a6;
  --accent:#ff8c00;
  --border:#222;

  /* Ligne de séparation verticale uniforme */
  --col-divider: rgba(255, 255, 255, 0.15);

  /* Neutre / Non validé */
  --row-pending-bg: rgba(255, 255, 255, 0.03);
  --row-pending-border: rgba(255, 255, 255, 0.12);

  /* Autodock / Compacteur */
  --row-special-bg: rgba(255, 255, 255, 0.02);
  --row-special-border: rgba(255, 255, 255, 0.06);

  /* Validé (Vert adouci) */
  --row-validated-bg: rgba(34, 197, 94, 0.12);
  --row-validated-border: rgba(34, 197, 94, 0.5);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:#fff}
.container{max-width:980px;margin:4px auto;padding:4px}
.header{display:flex;flex-direction:column;gap:6px;padding:2px 0}

/* Titre et boutons sur la même ligne */
.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  flex-wrap:nowrap;
}
.title{
  font-size:1rem;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.controls{
  display:flex;
  gap:6px;
  align-items:center;
  justify-content:flex-end;
  flex-shrink:0;
}
.btn{background:var(--card);border:1px solid var(--border);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:0.85rem;min-height:36px;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.primary{background:var(--accent);color:#000;font-weight:700;border:none}

.table-wrap{
  margin-top:6px;
  border-radius:8px;
  padding:0;
  background:var(--card);
  border:1px solid var(--border);
  overflow:visible;
}

.table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:0.88rem;
  table-layout:fixed;
}

/* --- STRUCTURE ET FIXATION (STICKY) DE L'EN-TÊTE --- */
.table thead th{
  background:var(--card);
  padding:4px 2px;
  text-align:center;
  vertical-align:middle;
  color:var(--muted);
  font-weight:700;
  white-space:nowrap;
  z-index:2000;
  font-size:0.82rem;
  border-right: none;
  border-bottom: 1px solid var(--col-divider);
  box-sizing: border-box;
  position: sticky;
}

/* Bordures verticales explicites */
.border-right {
  border-right: 1px solid var(--col-divider) !important;
}

/* Retrait de la bordure inférieure sous les en-têtes Calles et Chandelle */
.table thead th.group-header {
  border-bottom: none !important;
}

.table thead th:last-child {
  border-right: none;
}

/* Positionnement sticky sur 2 niveaux avec hauteurs fixes */
.table thead tr:first-child th {
  top: 0;
  height: 28px;
}
.table thead tr:nth-child(2) th {
  top: 28px;
  height: 26px;
}
.table thead th[rowspan="2"] {
  top: 0;
  height: 54px;
}

/* --- CORPS DU TABLEAU --- */
.table tbody tr {
  border-radius: 6px;
}

.table tbody tr td {
  padding:0;
  height:44px;
  vertical-align:middle;
  text-align:center;
  white-space:nowrap;
  border: none;
}

.table tbody tr td:first-child { 
  border-right: 1px solid var(--col-divider);
  border-top-left-radius: 6px; 
  border-bottom-left-radius: 6px; 
}
.table tbody tr td:last-child { 
  border-top-right-radius: 6px; 
  border-bottom-right-radius: 6px; 
}

/* Cellule spécifique du Quai */
.quai-cell-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 100%;
  width: 100%;
}

.quai-cell-content strong {
  line-height: 1;
}

/* 1. Neutre (Non Validé) */
.table tbody tr.row-pending { 
  background-color: var(--row-pending-bg);
  box-shadow: inset 0 0 0 1px var(--row-pending-border);
}

/* 2. Autodock / Compacteur */
.table tbody tr.row-special { 
  background-color: var(--row-special-bg); 
  opacity: 0.45;
  box-shadow: inset 0 0 0 1px var(--row-special-border);
}

/* 3. Validé */
.table tbody tr.row-validated { 
  background-color: var(--row-validated-bg); 
  opacity: 0.85;
  box-shadow: inset 0 0 0 1px var(--row-validated-border);
}

.table input[type="checkbox"] {
  width: 24px;
  height: 24px;
  accent-color: var(--accent);
  cursor: pointer;
  margin: 0;
  vertical-align: middle;
}

.table input[type="checkbox"]:disabled {
  opacity: 0.25;
  cursor: not-allowed;
}

/* Bouton de type de quai */
.type-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:2px;
  padding:2px 6px;
  background:#1a1a1a;
  border:1px solid #333;
  color:var(--accent);
  font-size:0.75rem;
  font-weight:700;
  border-radius:4px;
  cursor:pointer;
  transition:all 0.15s ease;
  line-height: 1;
}
.type-btn:hover{
  background:#262626;
  border-color:var(--accent);
  transform:scale(1.05);
}
.type-btn::after{
  content:'▾';
  font-size:0.7rem;
  color:var(--muted);
}

.comment-preview{display:flex;align-items:center;gap:4px;justify-content:center}
.comment-text{font-size:0.8rem;color:var(--muted);max-width:80px;overflow:hidden;text-overflow:ellipsis}
.btn-comment{padding:6px 10px;font-size:0.95rem;min-height:34px}

/* Alignement centré de la case de validation */
.valid-check{
  text-align: center;
  vertical-align: middle;
}

.type-menu{position:fixed;background:#141414;border:1px solid #333;border-radius:8px;min-width:190px;z-index:2500;box-shadow:0 4px 16px rgba(0,0,0,0.8)}
.type-menu button{display:block;width:100%;text-align:left;padding:12px 14px;background:transparent;border:0;color:#fff;cursor:pointer;font-size:0.9rem}
.type-menu button:hover{background:rgba(255,255,255,0.08);color:var(--accent)}

.modal-backdrop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:3000}
.modal{background:#0b0b0b;border:1px solid var(--border);padding:18px;border-radius:12px;max-width:500px;width:92%;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.modal .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.modal h3{margin:0;font-size:1.1rem}
.modal textarea{border-radius:8px;background:#121212;border:1px solid var(--border);color:#fff;padding:10px;font-size:0.95rem}
.modal pre{white-space:pre-wrap;font-family:monospace;background:#070707;padding:10px;border-radius:8px;border:1px solid var(--border);max-height:60vh;overflow:auto;color:#fff;font-size:0.86rem}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.close-x{background:transparent;border:0;color:#fff;font-size:1.3rem;padding:4px 8px;cursor:pointer}

/* Styles spécifiques pour le choix de démarrage */
.start-options{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.start-btn-option{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 16px;
  background:#141414;
  border:1px solid #2a2a2a;
  border-radius:8px;
  color:#fff;
  font-size:0.95rem;
  font-weight:600;
  cursor:pointer;
  transition:all 0.2s ease;
}
.start-btn-option:hover{
  background:#1f1f1f;
  border-color:var(--accent);
  color:var(--accent);
}

@media (max-width:760px){
  .container{padding:2px;margin:0 auto}
  .title{font-size:0.9rem}
  .btn{padding:5px 8px;font-size:0.8rem}
  .table td{padding:0}
  .comment-text{max-width:65px}
}
</style>
</head>
<body>
  <div class="container">
    <header class="header" role="banner">
      <div class="title-row">
        <div class="title">Contrôles — Calles & Chandelles</div>
        <div class="controls" role="region" aria-label="Actions principales">
          <button id="genBtn" class="btn">Générer Rapport</button>
          <button id="resetBtn" class="btn ghost">Réinitialiser</button>
        </div>
      </div>
    </header>

    <div class="table-wrap" id="tableWrap" aria-live="polite">
      <table id="quaisTable" class="table" aria-label="Tableau des quais">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="modalRoot" aria-hidden="true"></div>
  <div id="typeMenuRoot"></div>

<script>
const MIN_Q = 27, MAX_Q = 64;
const SKIP_QUAYS = new Set([27,64]);
const COMPACTEURS = new Set([38,48]);
const AUTODOCKS = new Set([63,54,49,42,35]);

const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const modalRoot = document.getElementById('modalRoot');

const genBtn = document.getElementById('genBtn');
const resetBtn = document.getElementById('resetBtn');

let mode = 'both';

let data = createInitialData();

function defaultTypeFor(n){
  if(COMPACTEURS.has(n)) return 'compacteur';
  if(AUTODOCKS.has(n)) return 'autodock';
  return 'normal';
}
function makeRecord(n){
  const t = defaultTypeFor(n);
  const isSpecial = (t !== 'normal');
  return {
    quai: n,
    /* Valeurs initiales à true par défaut (sauf si compacteur/autodock) */
    calles_both_present: !isSpecial,
    chains_ok: !isSpecial,
    chandelle_present: !isSpecial,
    chandelle_ok: !isSpecial,
    commentaire: '',
    type: t,
    validated: false
  };
}
function getQuays(){
  const out=[];
  for(let n=MIN_Q;n<=MAX_Q;n++) if(!SKIP_QUAYS.has(n)) out.push(n);
  return out;
}
function createInitialData(){
  const map={};
  getQuays().forEach(n=> map[n]=makeRecord(n));
  return map;
}

function computeRowStatus(rec){
  if(!rec) return 'pending';
  if(rec.type && rec.type !== 'normal') return 'special';
  return rec.validated ? 'validated' : 'pending';
}

function promptStartMode(){
  modalRoot.innerHTML=''; modalRoot.style.display='block'; modalRoot.setAttribute('aria-hidden','false');
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
  const modal=document.createElement('div'); modal.className='modal';
  
  const header=document.createElement('div'); header.className='title-row';
  const h=document.createElement('h3'); h.textContent='Quel type de contrôle souhaitez-vous effectuer ?';
  header.appendChild(h);

  const optionsDiv=document.createElement('div'); optionsDiv.className='start-options';

  const opts = [
    { value: 'both', label: 'Calles + Chandelles' },
    { value: 'calles', label: 'Uniquement Calles' },
    { value: 'chandelles', label: 'Uniquement Chandelles' }
  ];

  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'start-btn-option';
    btn.innerHTML = `<span>${opt.label}</span> <span>➔</span>`;
    btn.addEventListener('click', () => {
      mode = opt.value;
      closeModal();
      renderTable();
    });
    optionsDiv.appendChild(btn);
  });

  modal.appendChild(header);
  modal.appendChild(optionsDiv);
  backdrop.appendChild(modal);
  modalRoot.appendChild(backdrop);
}

function renderHeader(){
  tableHead.innerHTML = '';
  const row1 = document.createElement('tr');
  const row2 = document.createElement('tr');
  function th(html, opts={}){ 
    const e=document.createElement('th'); 
    e.innerHTML=html; 
    if(opts.colSpan) e.colSpan=opts.colSpan; 
    if(opts.rowSpan) e.rowSpan=opts.rowSpan; 
    if(opts.className) e.className=opts.className;
    return e; 
  }

  row1.appendChild(th('Quai',{rowSpan:2, className:'border-right'}));
  if(mode==='both' || mode==='calles') row1.appendChild(th('Calles',{colSpan:2, className:'group-header border-right'}));
  if(mode==='both' || mode==='chandelles') row1.appendChild(th('Chandelle',{colSpan:2, className:'group-header border-right'}));
  row1.appendChild(th('Commentaire',{rowSpan:2, className:'border-right'}));
  row1.appendChild(th('Validé',{rowSpan:2}));

  if(mode==='both' || mode==='calles'){ 
    row2.appendChild(th('2 Calles')); 
    row2.appendChild(th('Chaînes', {className:'border-right'})); 
  }
  if(mode==='both' || mode==='chandelles'){ 
    row2.appendChild(th('Présence')); 
    row2.appendChild(th('Bon état', {className:'border-right'})); 
  }

  tableHead.appendChild(row1);
  if(row2.children.length > 0) tableHead.appendChild(row2);
}

function tdQuai(n){
  const td=document.createElement('td'); 
  td.className='border-right';
  const wrap=document.createElement('div');
  wrap.className='quai-cell-content';
  
  const s=document.createElement('strong'); s.textContent='Q'+n; wrap.appendChild(s);
  
  const btn=document.createElement('button'); 
  btn.className='type-btn';
  btn.title = 'Cliquer pour changer le type de quai';
  const t = (data[n] && data[n].type) ? data[n].type : defaultTypeFor(n);
  btn.textContent = (t==='normal')?'Quai':(t==='autodock'?'Auto':'Comp');
  btn.addEventListener('click',(ev)=>{ ev.stopPropagation(); openTypeMenu(n, btn); });
  
  wrap.appendChild(btn);
  td.appendChild(wrap);
  return td;
}
function tdCheckbox(n,key, isGroupEnd = false){
  const td=document.createElement('td');
  if(isGroupEnd) td.className = 'border-right';
  const inp=document.createElement('input'); inp.type='checkbox'; inp.autocomplete='off';
  inp.checked = !!(data[n] && data[n][key]);
  inp.addEventListener('change', ()=>{
    if(!data[n]) data[n]=makeRecord(n);
    data[n][key] = inp.checked;
  });
  td.appendChild(inp); return td;
}
function tdComment(n){
  const td=document.createElement('td');
  td.className = 'border-right';
  const wrap=document.createElement('div'); wrap.className='comment-preview';
  const span=document.createElement('span'); span.className='comment-text';
  span.textContent = (data[n] && data[n].commentaire) ? data[n].commentaire : '';
  span.title = span.textContent;
  const btn=document.createElement('button'); btn.className='btn btn-comment'; btn.textContent='✎';
  btn.addEventListener('click', ()=> openCommentModal(n));
  wrap.appendChild(span); wrap.appendChild(btn); td.appendChild(wrap);
  return td;
}
function tdValidated(n){
  const td=document.createElement('td'); td.className='valid-check';
  const rec = data[n];
  const isSpecial = rec && rec.type && rec.type !== 'normal';

  if(isSpecial){
    td.textContent = '—';
    td.style.color = 'var(--muted)';
    return td;
  }

  const inp=document.createElement('input'); inp.type='checkbox';
  inp.checked = !!(rec && rec.validated);
  inp.addEventListener('change', ()=>{
    if(!data[n]) data[n]=makeRecord(n);
    data[n].validated = inp.checked;
    renderTable();
  });
  td.appendChild(inp); return td;
}

let activeTypeMenu = null;
function openTypeMenu(n, anchor){
  closeTypeMenu();
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement('div'); menu.className='type-menu';
  menu.style.left = Math.max(8, rect.left - 20) + 'px';
  menu.style.top = Math.min(window.innerHeight - 150, rect.bottom + 6) + 'px';
  const opts = [
    {v:'normal', t:' Quai standard'},
    {v:'autodock', t:' Autodock'},
    {v:'compacteur', t:' Compacteur'}
  ];
  opts.forEach(o=>{
    const b=document.createElement('button'); b.textContent=o.t;
    b.addEventListener('click', ()=>{
      if(!data[n]) data[n]=makeRecord(n);
      data[n].type = o.v;
      if(o.v !== 'normal'){
        data[n].calles_both_present = false;
        data[n].chains_ok = false;
        data[n].chandelle_present = false;
        data[n].chandelle_ok = false;
        data[n].validated = false;
      } else {
        data[n].calles_both_present = true;
        data[n].chains_ok = true;
        data[n].chandelle_present = true;
        data[n].chandelle_ok = true;
      }
      renderTable();
      closeTypeMenu();
    });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  activeTypeMenu = menu;
  setTimeout(()=>{ document.addEventListener('click', onDocClickForTypeMenu); window.addEventListener('resize', closeTypeMenu); window.addEventListener('scroll', closeTypeMenu, true); }, 0);
}
function onDocClickForTypeMenu(e){ if(activeTypeMenu && !activeTypeMenu.contains(e.target)) closeTypeMenu(); }
function closeTypeMenu(){ if(activeTypeMenu){ activeTypeMenu.remove(); activeTypeMenu=null; document.removeEventListener('click', onDocClickForTypeMenu); window.removeEventListener('resize', closeTypeMenu); window.removeEventListener('scroll', closeTypeMenu, true); } }

function openCommentModal(n){
  modalRoot.innerHTML=''; modalRoot.style.display='block'; modalRoot.setAttribute('aria-hidden','false');
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
  const modal=document.createElement('div'); modal.className='modal';
  const header=document.createElement('div'); header.className='title-row';
  const h=document.createElement('h3'); h.textContent='Commentaire — Quai ' + n;
  const close=document.createElement('button'); close.className='close-x'; close.innerHTML='✕'; close.addEventListener('click', closeModal);
  header.appendChild(h); header.appendChild(close);
  const ta=document.createElement('textarea'); ta.autocomplete='off'; ta.style.width='100%'; ta.style.minHeight='120px';
  ta.value = (data[n] && data[n].commentaire) ? data[n].commentaire : '';
  const actions=document.createElement('div'); actions.className='actions';
  const save=document.createElement('button'); save.className='btn primary'; save.textContent='Enregistrer';
  const cancel=document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Annuler';
  save.addEventListener('click', ()=>{ if(!data[n]) data[n]=makeRecord(n); data[n].commentaire = ta.value; closeModal(); renderTable(); });
  cancel.addEventListener('click', closeModal);
  actions.appendChild(cancel); actions.appendChild(save);
  modal.appendChild(header); modal.appendChild(ta); modal.appendChild(actions);
  backdrop.appendChild(modal); modalRoot.appendChild(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) closeModal(); });
  setTimeout(()=> ta.focus(), 80);
}
function closeModal(){ modalRoot.innerHTML=''; modalRoot.style.display='none'; modalRoot.setAttribute('aria-hidden','true'); }

function openReportModal(){
  modalRoot.innerHTML=''; modalRoot.style.display='block'; modalRoot.setAttribute('aria-hidden','false');
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
  const modal=document.createElement('div'); modal.className='modal';
  const header=document.createElement('div'); header.className='title-row';
  const h=document.createElement('h3'); h.textContent='Compte rendu — Calles & Chandelles';
  const close=document.createElement('button'); close.className='close-x'; close.innerHTML='✕'; close.addEventListener('click', closeModal);
  header.appendChild(h); header.appendChild(close);
  const pre=document.createElement('pre'); pre.textContent = generateReportText().join('\n');
  const actions=document.createElement('div'); actions.className='actions';
  const copy=document.createElement('button'); copy.className='btn primary'; copy.textContent='📋 Copier';
  copy.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(pre.innerText); copy.textContent='✅ Copié'; setTimeout(()=>copy.textContent='📋 Copier',1200); }catch(e){ alert('Impossible de copier : '+e); } });
  actions.appendChild(copy);
  modal.appendChild(header); modal.appendChild(pre); modal.appendChild(actions);
  backdrop.appendChild(modal); modalRoot.appendChild(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) closeModal(); });
}

function generateReportText(){
  const quays = getQuays().slice().sort((a,b)=>a-b);
  const lines = [];
  
  lines.push('============================================');
  lines.push('COMPTE RENDU — CALLES & CHANDELLES');
  lines.push('Date : ' + new Date().toLocaleString('fr-FR', {
    day: '2-digit', month: '2-digit', year: 'numeric',
    hour: '2-digit', minute: '2-digit', second: '2-digit'
  }).replace(',', ' à'));
  lines.push('============================================');
  lines.push('');

  let problemCount = 0;

  quays.forEach(n=>{
    const r = data[n] || makeRecord(n);
    if(r.type && r.type !== 'normal') return;
    
    const issues = [];
    if(mode==='both' || mode==='calles'){
      if(!r.calles_both_present) issues.push('Calles manquantes');
      if(!r.chains_ok) issues.push('Chaînes cassées');
    }
    if(mode==='both' || mode==='chandelles'){
      if(!r.chandelle_present) issues.push('Chandelle absente');
      else if(!r.chandelle_ok) issues.push('Chandelle endommagée');
    }
    const hasComment = r.commentaire && r.commentaire.trim();
    if(issues.length===0 && !hasComment) return;

    problemCount++;
    lines.push(`• Quai ${n}`);
    issues.forEach(i=>lines.push(`  ➔ ${i}`));
    if(hasComment) lines.push(`  ➔ Commentaire : ${r.commentaire.trim()}`);
    lines.push('');
  });

  lines.push('--------------------------------------------');
  if(problemCount === 0) {
    lines.push('Résultat : Aucun problème détecté');
  } else {
    lines.push(`Résultat : Anomalies détectées (${problemCount} quai(s))`);
  }

  return lines;
}

function renderTable(){
  renderHeader();
  while(tableBody.firstChild) tableBody.removeChild(tableBody.firstChild);
  const quays = getQuays().slice();
  quays.forEach(n=>{
    const rec = data[n] || makeRecord(n);
    const tr = document.createElement('tr'); tr.id='row-'+n;
    
    const st = computeRowStatus(rec);
    tr.className = 'row-' + st;

    const quaiTd = tdQuai(n);
    const cells = [];
    cells.push(quaiTd);
    if(mode==='both' || mode==='calles'){ 
      cells.push(tdCheckbox(n,'calles_both_present')); 
      cells.push(tdCheckbox(n,'chains_ok', true)); 
    }
    if(mode==='both' || mode==='chandelles'){ 
      cells.push(tdCheckbox(n,'chandelle_present')); 
      cells.push(tdCheckbox(n,'chandelle_ok', true)); 
    }
    cells.push(tdComment(n));
    cells.push(tdValidated(n));

    cells.forEach(c=>tr.appendChild(c));

    const isNonNormal = rec.type && rec.type !== 'normal';
    const isValidated = rec.validated;
    cells.forEach(td=>{
      const inp = td.querySelector && td.querySelector('input');
      if(!inp) return;
      if(td.classList && td.classList.contains('valid-check')) return;
      if(isNonNormal || isValidated) inp.disabled = true;
      else inp.disabled = false;
    });

    tableBody.appendChild(tr);
  });
}

genBtn.addEventListener('click', ()=> openReportModal());
resetBtn.addEventListener('click', ()=>{ if(!confirm('Réinitialiser toutes les données ?')) return; data = createInitialData(); promptStartMode(); });

// Initialisation au chargement de la page
promptStartMode();

window.addEventListener('beforeunload', ()=>{ if(activeTypeMenu) closeTypeMenu(); });
</script>
</body>
</html>
