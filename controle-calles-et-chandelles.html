<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contrôles — Calles & Chandelles</title>
<style>
:root{
  --bg:#000;
  --card:#0b0b0b;
  --muted:#9aa0a6;
  --accent:#ff8c00;
  --border:#222;
  --good:#22c55e;
  --bad:#ff4444;

  --h1:28px;
  --h2:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:#fff}
.container{max-width:980px;margin:12px auto;padding:10px}
.header{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:1rem;font-weight:700}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--border);color:#fff;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:0.86rem}
.btn.ghost{background:transparent;color:var(--muted)}
.small{font-size:0.78rem;color:var(--muted)}

/* table container: removed max-height and internal scrollbars (overflow visible) */
.table-wrap{
  margin-top:8px;
  border-radius:8px;
  padding:0;
  background:var(--card);
  border:1px solid var(--border);
  overflow:visible; /* removed max-height so page scrollbar is used */
}

.table{
  width:100%;
  border-collapse:collapse;
  font-size:0.86rem;
  table-layout:fixed;
}
.table thead tr{display:table-row}
.table thead th{
  background:var(--card);
  padding:4px 6px;
  text-align:center;
  color:var(--muted);
  font-weight:700;
  white-space:nowrap;
  z-index:2000; /* headers on top of content */
}
/* precise sticky positions so there's no gap when scrolling (sticky relative to viewport) */
.table thead tr:first-child th{
  height:var(--h1);
  line-height:var(--h1);
  position:sticky;
  top:0;
}
.table thead tr:nth-child(2) th{
  height:var(--h2);
  line-height:var(--h2);
  position:sticky;
  top:var(--h1);
}
/* avoid seam between header rows */
.table thead tr:first-child th,
.table thead tr:nth-child(2) th { border-bottom:none; border-top:none; box-shadow:none; }

/* data rows */
.table td{
  padding:6px 8px;
  border-top:1px solid rgba(255,255,255,0.02);
  vertical-align:middle;
  white-space:nowrap;
  background:transparent;
}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,0.06)}
.type-btn{display:inline-flex;align-items:center;justify-content:center;margin-left:8px;min-width:22px;height:22px;padding:0 6px;background:#0d0d0d;border:1px solid var(--border);color:#ddd;font-size:0.82rem;border-radius:6px;cursor:pointer;position:relative;z-index:10}
.comment-preview{display:flex;align-items:center;gap:8px}
.comment-text{font-size:0.82rem;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis}

/* validated checkbox cell at end */
.valid-check{display:flex;align-items:center;gap:8px;justify-content:center}
.valid-check input{width:16px;height:16px}

/* type menu: fixed; z-index lower than header so it doesn't cover titles */
.type-menu{position:fixed;background:#0d0d0d;border:1px solid var(--border);border-radius:6px;min-width:160px;z-index:1500}
.type-menu button{display:block;width:100%;text-align:left;padding:8px 10px;background:transparent;border:0;color:#fff;cursor:pointer}
.type-menu button:hover{background:rgba(255,255,255,0.02)}

/* modal overlay (report & comment) */
.modal-backdrop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:3000}
.modal{background:#0b0b0b;border:1px solid var(--border);padding:12px;border-radius:8px;max-width:820px;width:94%;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,0.7)}
.modal .title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modal h3{margin:0;font-size:1rem}
.modal pre{white-space:pre-wrap;font-family:monospace;background:#070707;padding:10px;border-radius:8px;border:1px solid var(--border);max-height:60vh;overflow:auto;color:#fff;font-size:0.86rem}
.close-x{background:transparent;border:0;color:#fff;font-size:1.1rem;cursor:pointer}

@media (max-width:760px){
  .comment-text{max-width:100px}
  .type-btn{min-width:20px;height:20px;padding:0 5px;font-size:0.78rem}
  .table thead tr:first-child th{height:26px;line-height:26px}
  .table thead tr:nth-child(2) th{height:18px;line-height:18px}
}
</style>
</head>
<body>
  <div class="container">
    <header class="header" role="banner">
      <div class="title-row">
        <div><div class="title">Contrôles — Calles & Chandelles</div></div>
        <div class="controls" role="region" aria-label="Actions principales">
          <div class="small">Mode :</div>
          <select id="modeSelect" class="btn" title="Choisir le mode de contrôle">
            <option value="both">Calles + Chandelles</option>
            <option value="calles">Uniquement Calles</option>
            <option value="chandelles">Uniquement Chandelles</option>
          </select>
          <button id="startBtn" class="btn">Démarrer contrôle</button>
          <button id="genBtn" class="btn">Générer</button>
          <button id="resetBtn" class="btn ghost">Réinit</button>
        </div>
      </div>
    </header>

    <div class="table-wrap" id="tableWrap" aria-live="polite">
      <table id="quaisTable" class="table" aria-label="Tableau des quais">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="modalRoot" aria-hidden="true"></div>
  <div id="typeMenuRoot"></div>

<script>
/* Data and behavior
   - Once a row is validated, other inputs on that line are locked but the validation checkbox itself remains togglable.
   - This file is identical to previous behavior except the disabling logic excludes the validated checkbox so you can uncheck it anytime.
   - 27 and 64 permanently excluded; autodock/compacteur excluded from checks/report.
*/

const MIN_Q = 27, MAX_Q = 64;
const SKIP_QUAYS = new Set([27,64]);
const COMPACTEURS = new Set([38,48]);
const AUTODOCKS = new Set([63,54,49,42,35]);

const DATA_KEY = 'calles_chandelles';
const MODE_KEY = 'calles_chandelles_mode';

const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const modalRoot = document.getElementById('modalRoot');

const modeSelect = document.getElementById('modeSelect');
const startBtn = document.getElementById('startBtn');
const genBtn = document.getElementById('genBtn');
const resetBtn = document.getElementById('resetBtn');

let mode = localStorage.getItem(MODE_KEY) || 'both';
modeSelect.value = mode;

let data = loadData();

function defaultTypeFor(n){
  if(COMPACTEURS.has(n)) return 'compacteur';
  if(AUTODOCKS.has(n)) return 'autodock';
  return 'normal';
}
function makeRecord(n){
  return {
    quai: n,
    calles_both_present: false,
    chains_ok: true,
    chandelle_present: false,
    chandelle_ok: true,
    commentaire: '',
    type: defaultTypeFor(n),
    validated: false
  };
}
function getQuays(){
  const out=[];
  for(let n=MIN_Q;n<=MAX_Q;n++) if(!SKIP_QUAYS.has(n)) out.push(n);
  return out;
}
function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      getQuays().forEach(n=>{
        if(!parsed[n]) parsed[n]=makeRecord(n);
        if(!parsed[n].type) parsed[n].type = defaultTypeFor(n);
        if(typeof parsed[n].validated === 'undefined') parsed[n].validated = false;
      });
      return parsed;
    }
  }catch(e){}
  const map={};
  getQuays().forEach(n=> map[n]=makeRecord(n));
  localStorage.setItem(DATA_KEY, JSON.stringify(map));
  return map;
}
function persist(){ localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
function persistMode(){ localStorage.setItem(MODE_KEY, mode); }

/* compute status; autodock/compacteur => treated as OK */
function computeRowStatus(rec){
  if(!rec) return 'bad';
  if(rec.type && rec.type !== 'normal') return 'good';
  if(mode === 'calles') return (rec.calles_both_present && rec.chains_ok) ? 'good' : 'bad';
  if(mode === 'chandelles') return (rec.chandelle_present && rec.chandelle_ok) ? 'good' : 'bad';
  return (rec.calles_both_present && rec.chains_ok && rec.chandelle_present && rec.chandelle_ok) ? 'good' : 'bad';
}
function statusColor(st){ return st==='good' ? getComputedStyle(document.documentElement).getPropertyValue('--good').trim() : getComputedStyle(document.documentElement).getPropertyValue('--bad').trim(); }

/* render header depending on mode */
function renderHeader(){
  tableHead.innerHTML = '';
  const row1 = document.createElement('tr');
  const row2 = document.createElement('tr');
  function th(html, opts={}){ const e=document.createElement('th'); e.innerHTML=html; if(opts.colSpan) e.colSpan=opts.colSpan; if(opts.rowSpan) e.rowSpan=opts.rowSpan; return e; }

  row1.appendChild(th(''));
  row1.appendChild(th('Quai',{rowSpan:2}));
  if(mode==='both' || mode==='calles') row1.appendChild(th('Calles',{colSpan:2}));
  if(mode==='both' || mode==='chandelles') row1.appendChild(th('Chandelle',{colSpan:2}));
  row1.appendChild(th('Commentaire',{rowSpan:2}));
  row1.appendChild(th('Validé',{rowSpan:2}));

  row2.appendChild(th(''));
  if(mode==='both' || mode==='calles'){ row2.appendChild(th('Présence')); row2.appendChild(th('Chaînes')); }
  if(mode==='both' || mode==='chandelles'){ row2.appendChild(th('Présence')); row2.appendChild(th('Etat')); }

  tableHead.appendChild(row1);
  tableHead.appendChild(row2);
}

/* cell helpers */
function tdStatus(rec,n){
  const td=document.createElement('td'); td.style.textAlign='center';
  const dot=document.createElement('span'); dot.className='status-dot';
  const st = computeRowStatus(rec);
  dot.style.background = statusColor(st);
  dot.title = st==='good' ? 'OK' : 'Défaut';
  td.appendChild(dot);
  return td;
}
function tdQuai(n){
  const td=document.createElement('td'); td.style.display='flex'; td.style.alignItems='center';
  const s=document.createElement('strong'); s.textContent='Q'+n; td.appendChild(s);
  const btn=document.createElement('button'); btn.className='type-btn';
  const t = (data[n] && data[n].type) ? data[n].type : defaultTypeFor(n);
  btn.textContent = (t==='normal')?'Q':(t==='autodock'?'A':'C');
  btn.addEventListener('click',(ev)=>{ ev.stopPropagation(); openTypeMenu(n, btn); });
  td.appendChild(btn);
  return td;
}
function tdCheckbox(n,key){
  const td=document.createElement('td'); td.style.textAlign='center';
  const inp=document.createElement('input'); inp.type='checkbox'; inp.autocomplete='off';
  inp.checked = !!(data[n] && data[n][key]);
  // input will be disabled later depending on type/validated; keep as-is here
  inp.addEventListener('change', ()=>{ if(!data[n]) data[n]=makeRecord(n); data[n][key]=inp.checked; persist(); updateRowStatus(n); });
  td.appendChild(inp); return td;
}
function tdComment(n){
  const td=document.createElement('td');
  const wrap=document.createElement('div'); wrap.className='comment-preview';
  const span=document.createElement('span'); span.className='comment-text';
  span.textContent = (data[n] && data[n].commentaire) ? data[n].commentaire : '';
  span.title = span.textContent;
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='✎'; btn.style.padding='4px 8px';
  btn.addEventListener('click', ()=> openCommentModal(n));
  wrap.appendChild(span); wrap.appendChild(btn); td.appendChild(wrap);
  return td;
}
function tdValidated(n){
  const td=document.createElement('td'); td.className='valid-check';
  const inp=document.createElement('input'); inp.type='checkbox';
  inp.checked = !!(data[n] && data[n].validated);
  inp.addEventListener('change', ()=>{
    if(!data[n]) data[n]=makeRecord(n);
    data[n].validated = inp.checked;
    persist();
    renderTable(); // re-render to lock/unlock other inputs
  });
  td.appendChild(inp); return td;
}

/* type menu */
let activeTypeMenu = null;
function openTypeMenu(n, anchor){
  closeTypeMenu();
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement('div'); menu.className='type-menu';
  menu.style.left = Math.max(8, rect.left) + 'px';
  menu.style.top = Math.min(window.innerHeight - 120, rect.bottom + 6) + 'px';
  const opts = [
    {v:'normal', t:'Quai (Normal)'},
    {v:'autodock', t:'Autodock (pas de contrôle)'},
    {v:'compacteur', t:'Compacteur (pas de contrôle)'}
  ];
  opts.forEach(o=>{
    const b=document.createElement('button'); b.textContent=o.t;
    b.addEventListener('click', ()=>{
      if(!data[n]) data[n]=makeRecord(n);
      data[n].type = o.v;
      persist();
      renderTable();
      closeTypeMenu();
    });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  activeTypeMenu = menu;
  setTimeout(()=>{ document.addEventListener('click', onDocClickForTypeMenu); window.addEventListener('resize', closeTypeMenu); window.addEventListener('scroll', closeTypeMenu, true); }, 0);
}
function onDocClickForTypeMenu(e){ if(activeTypeMenu && !activeTypeMenu.contains(e.target)) closeTypeMenu(); }
function closeTypeMenu(){ if(activeTypeMenu){ activeTypeMenu.remove(); activeTypeMenu=null; document.removeEventListener('click', onDocClickForTypeMenu); window.removeEventListener('resize', closeTypeMenu); window.removeEventListener('scroll', closeTypeMenu, true); } }

/* comment modal (centered) */
function openCommentModal(n){
  modalRoot.innerHTML=''; modalRoot.style.display='block'; modalRoot.setAttribute('aria-hidden','false');
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
  const modal=document.createElement('div'); modal.className='modal';
  const header=document.createElement('div'); header.className='title-row';
  const h=document.createElement('h3'); h.textContent='Commentaire — Quai ' + n;
  const close=document.createElement('button'); close.className='close-x'; close.innerHTML='✕'; close.addEventListener('click', closeModal);
  header.appendChild(h); header.appendChild(close);
  const ta=document.createElement('textarea'); ta.autocomplete='off'; ta.style.width='100%'; ta.style.minHeight='120px';
  ta.value = (data[n] && data[n].commentaire) ? data[n].commentaire : '';
  const actions=document.createElement('div'); actions.className='actions';
  const save=document.createElement('button'); save.className='btn'; save.textContent='Enregistrer';
  const cancel=document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Annuler';
  save.addEventListener('click', ()=>{ if(!data[n]) data[n]=makeRecord(n); data[n].commentaire = ta.value; persist(); closeModal(); renderTable(); });
  cancel.addEventListener('click', closeModal);
  actions.appendChild(cancel); actions.appendChild(save);
  modal.appendChild(header); modal.appendChild(ta); modal.appendChild(actions);
  backdrop.appendChild(modal); modalRoot.appendChild(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) closeModal(); });
  setTimeout(()=> ta.focus(), 80);
}
function closeModal(){ modalRoot.innerHTML=''; modalRoot.style.display='none'; modalRoot.setAttribute('aria-hidden','true'); }

/* report modal (overlay) */
function openReportModal(){
  modalRoot.innerHTML=''; modalRoot.style.display='block'; modalRoot.setAttribute('aria-hidden','false');
  const backdrop=document.createElement('div'); backdrop.className='modal-backdrop';
  const modal=document.createElement('div'); modal.className='modal';
  const header=document.createElement('div'); header.className='title-row';
  const h=document.createElement('h3'); h.textContent='Compte rendu — Calles & Chandelles';
  const close=document.createElement('button'); close.className='close-x'; close.innerHTML='✕'; close.addEventListener('click', closeModal);
  header.appendChild(h); header.appendChild(close);
  const pre=document.createElement('pre'); pre.textContent = generateReportText().join('\n');
  const actions=document.createElement('div'); actions.className='actions';
  const copy=document.createElement('button'); copy.className='btn'; copy.textContent='📋 Copier';
  copy.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(pre.innerText); copy.textContent='✅ Copié'; setTimeout(()=>copy.textContent='📋 Copier',1200); }catch(e){ alert('Impossible de copier : '+e); } });
  actions.appendChild(copy);
  modal.appendChild(header); modal.appendChild(pre); modal.appendChild(actions);
  backdrop.appendChild(modal); modalRoot.appendChild(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) closeModal(); });
}

/* generate report lines (ascending), skip autodock/compacteur, format as requested */
function generateReportText(){
  const quays = getQuays().slice().sort((a,b)=>a-b);
  const lines = [];
  lines.push('Compte rendu — Calles & Chandelles');
  lines.push('Généré le : ' + new Date().toLocaleString('fr-FR'));
  lines.push('--------------------------------------------');
  let any=false;
  quays.forEach(n=>{
    const r = data[n] || makeRecord(n);
    if(r.type && r.type !== 'normal') return;
    const issues = [];
    if(mode==='both' || mode==='calles'){
      if(!r.calles_both_present) issues.push('Calles manquantes');
      if(!r.chains_ok) issues.push('Chaînes cassées');
    }
    if(mode==='both' || mode==='chandelles'){
      if(!r.chandelle_present) issues.push('Chandelle absente');
      else if(!r.chandelle_ok) issues.push('Chandelle endommagée');
    }
    const hasComment = r.commentaire && r.commentaire.trim();
    if(issues.length===0 && !hasComment) return;
    any=true;
    lines.push('---');
    lines.push(`Quai ${n} :`);
    issues.forEach(i=>lines.push(i));
    if(hasComment) lines.push(r.commentaire.trim());
    lines.push('---');
  });
  if(!any) lines.push('Aucun problème détecté et aucun commentaire (hors autodock/compacteur).');
  return lines;
}

/* render table */
function renderTable(){
  renderHeader();
  while(tableBody.firstChild) tableBody.removeChild(tableBody.firstChild);
  const quays = getQuays().slice();
  const ordered = quays; // ascending visually
  ordered.forEach(n=>{
    const rec = data[n] || makeRecord(n);
    const tr = document.createElement('tr'); tr.id='row-'+n;
    const statusTd = tdStatus(rec,n);
    const quaiTd = tdQuai(n);
    const cells = [];
    cells.push(statusTd);
    cells.push(quaiTd);
    if(mode==='both' || mode==='calles'){ cells.push(tdCheckbox(n,'calles_both_present')); cells.push(tdCheckbox(n,'chains_ok')); }
    if(mode==='both' || mode==='chandelles'){ cells.push(tdCheckbox(n,'chandelle_present')); cells.push(tdCheckbox(n,'chandelle_ok')); }
    cells.push(tdComment(n));
    cells.push(tdValidated(n));

    // Append cells to row first
    cells.forEach(c=>tr.appendChild(c));
    // Now disable inputs for non-normal type or when validated, BUT do NOT disable the validated checkbox itself.
    if(rec.type && rec.type !== 'normal'){
      cells.forEach(td=>{
        const inp = td.querySelector && td.querySelector('input');
        if(inp){
          // if this input is the validated checkbox (in a .valid-check cell), leave it enabled
          if(td.classList && td.classList.contains('valid-check')) return;
          inp.disabled = true;
        }
      });
    }
    if(rec.validated){
      cells.forEach(td=>{
        const inp = td.querySelector && td.querySelector('input');
        if(inp){
          if(td.classList && td.classList.contains('valid-check')) return; // keep validated checkbox enabled
          inp.disabled = true;
        }
      });
    }

    tableBody.appendChild(tr);
  });
}

/* events */
modeSelect.addEventListener('change', ()=>{ mode = modeSelect.value; persistMode(); renderTable(); });
startBtn.addEventListener('click', ()=>{ const m = mode==='both' ? 'Calles + Chandelles' : (mode==='calles' ? 'Uniquement Calles' : 'Uniquement Chandelles'); if(confirm(`Démarrer le contrôle en mode : ${m} ?`)) alert('Mode appliqué: '+m); });
genBtn.addEventListener('click', ()=> openReportModal());
resetBtn.addEventListener('click', ()=>{ if(!confirm('Réinitialiser toutes les données ?')) return; getQuays().forEach(n=>data[n]=makeRecord(n)); persist(); renderTable(); });

/* init */
function loadInitial(){ try{ const raw = localStorage.getItem(DATA_KEY); if(raw) data = JSON.parse(raw); }catch(e){} if(!data) data={}; getQuays().forEach(n=>{ if(!data[n]) data[n]=makeRecord(n); if(!data[n].type) data[n].type = defaultTypeFor(n); if(typeof data[n].validated === 'undefined') data[n].validated=false; }); }
loadInitial();
renderTable();

/* cleanup */
window.addEventListener('beforeunload', ()=>{ if(activeTypeMenu) closeTypeMenu(); });
</script>
</body>
</html>
