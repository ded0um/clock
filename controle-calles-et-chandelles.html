<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Contrôles — Calles & Chandelles (v5)</title>
<style>
:root{
  --bg:#000;
  --card:#0b0b0b;
  --muted:#9aa0a6;
  --accent:#ff8c00;
  --border:#222;
  --good:#22c55e;
  --bad:#ff4444;

  --h1:28px;
  --h2:20px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:#fff}
.container{max-width:980px;margin:12px auto;padding:10px}
.header{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title{font-size:1rem;font-weight:700}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--card);border:1px solid var(--border);color:#fff;padding:6px 9px;border-radius:8px;cursor:pointer;font-size:0.86rem}
.btn.ghost{background:transparent;color:var(--muted)}
.small{font-size:0.78rem;color:var(--muted)}

/* table */
.table-wrap{margin-top:8px;border-radius:8px;padding:0;background:var(--card);border:1px solid var(--border);overflow:auto;max-height:68vh}
.table{width:100%;border-collapse:collapse;font-size:0.86rem;table-layout:fixed}
.table thead tr{display:table-row}
.table thead th{
  background:var(--card);
  padding:4px 6px;
  text-align:center;
  color:var(--muted);
  font-weight:700;
  white-space:nowrap;
  z-index:2000; /* headers on top */
}
.table thead tr:first-child th{height:var(--h1);line-height:var(--h1);position:sticky;top:0}
.table thead tr:nth-child(2) th{height:var(--h2);line-height:var(--h2);position:sticky;top:var(--h1)}
/* avoid seam between header rows */
.table thead tr:first-child th,
.table thead tr:nth-child(2) th { border-bottom: none; border-top: none; box-shadow:none; }

/* data */
.table td{padding:6px 8px;border-top:1px solid rgba(255,255,255,0.02);vertical-align:middle;white-space:nowrap}
.status-dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,0.06)}
.type-btn{display:inline-flex;align-items:center;justify-content:center;margin-left:8px;min-width:22px;height:22px;padding:0 6px;background:#0d0d0d;border:1px solid var(--border);color:#ddd;font-size:0.82rem;border-radius:6px;cursor:pointer;position:relative;z-index:10}
.comment-preview{display:flex;align-items:center;gap:8px}
.comment-text{font-size:0.82rem;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis}

/* type menu (fixed) placed under anchor; z-index lower than header so header not overlapped) */
.type-menu{position:fixed;background:#0d0d0d;border:1px solid var(--border);border-radius:6px;min-width:160px;z-index:1500}
.type-menu button{display:block;width:100%;text-align:left;padding:8px 10px;background:transparent;border:0;color:#fff;cursor:pointer}
.type-menu button:hover{background:rgba(255,255,255,0.02)}

/* validate badge */
.valid-badge{display:inline-block;margin-left:8px;padding:2px 6px;background:rgba(34,197,94,0.12);color:var(--good);border:1px solid rgba(34,197,94,0.18);border-radius:6px;font-size:0.75rem}

/* responsive */
@media (max-width:760px){
  .comment-text{max-width:100px}
  .type-btn{min-width:20px;height:20px;padding:0 5px;font-size:0.78rem}
  .table thead tr:first-child th{height:26px;line-height:26px}
  .table thead tr:nth-child(2) th{height:18px;line-height:18px}
}
</style>
</head>
<body>
  <div class="container">
    <header class="header" role="banner">
      <div class="title-row">
        <div><div class="title">Contrôles — Calles & Chandelles</div></div>
        <div class="controls" role="region" aria-label="Actions principales">
          <div class="small">Mode :</div>
          <select id="modeSelect" class="btn" title="Choisir le mode de contrôle">
            <option value="both">Calles + Chandelles</option>
            <option value="calles">Uniquement Calles</option>
            <option value="chandelles">Uniquement Chandelles</option>
          </select>
          <button id="startBtn" class="btn">Démarrer contrôle</button>
          <button id="genBtn" class="btn">Générer</button>
          <button id="resetBtn" class="btn ghost">Réinit</button>
        </div>
      </div>
    </header>

    <div class="table-wrap" id="tableWrap" aria-live="polite">
      <table id="quaisTable" class="table" aria-label="Tableau des quais">
        <thead id="tableHead"></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div id="modalRoot" aria-hidden="true"></div>
  <div id="typeMenuRoot"></div>

<script>
/* v5: new features requested:
 - report opens in a NEW WINDOW (synchronously via window.open + write) with copy button
 - header sticky gap fixed (precise heights + no borders)
 - visual validation per quay (validé badge toggle)
 - initial/selectable control mode (both / calles / chandelles) — UI adapts (hide irrelevant columns)
 - autodock/compacteur quays skipped from checks & report
 - 27 and 64 permanently removed
*/

const MIN_Q = 27, MAX_Q = 64;
const SKIP_QUAYS = new Set([27,64]);
const COMPACTEURS = new Set([38,48]);
const AUTODOCKS = new Set([63,54,49,42,35]);

const DATA_KEY = 'calles_chandelles_v5';
const SIDE_KEY = 'quais_side_v5';
const MODE_KEY = 'calles_chandelles_mode_v5';

const tableHead = document.getElementById('tableHead');
const tableBody = document.getElementById('tableBody');
const modalRoot = document.getElementById('modalRoot');
const typeMenuRoot = document.getElementById('typeMenuRoot');

const modeSelect = document.getElementById('modeSelect');
const startBtn = document.getElementById('startBtn');
const genBtn = document.getElementById('genBtn');
const resetBtn = document.getElementById('resetBtn');

let side = localStorage.getItem(SIDE_KEY) || 'left';
let mode = localStorage.getItem(MODE_KEY) || 'both'; // 'both' | 'calles' | 'chandelles'
modeSelect.value = mode;

let data = loadData();

function defaultTypeFor(n){
  if(COMPACTEURS.has(n)) return 'compacteur';
  if(AUTODOCKS.has(n)) return 'autodock';
  return 'normal';
}
function makeRecord(n){
  return {
    quai: n,
    calles_both_present: false,
    chains_ok: true,
    chandelle_present: false,
    chandelle_ok: true,
    commentaire: '',
    type: defaultTypeFor(n), // normal | autodock | compacteur
    validated: false
  };
}
function getQuays(){
  const out=[];
  for(let n=MIN_Q;n<=MAX_Q;n++) if(!SKIP_QUAYS.has(n)) out.push(n);
  return out;
}
function loadData(){
  try{
    const raw = localStorage.getItem(DATA_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      getQuays().forEach(n=>{
        if(!parsed[n]) parsed[n]=makeRecord(n);
        if(!parsed[n].type) parsed[n].type = defaultTypeFor(n);
        if(typeof parsed[n].validated === 'undefined') parsed[n].validated = false;
      });
      return parsed;
    }
  }catch(e){}
  const map={};
  getQuays().forEach(n=> map[n]=makeRecord(n));
  localStorage.setItem(DATA_KEY, JSON.stringify(map));
  return map;
}
function persist(){ localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
function persistMode(){ localStorage.setItem(MODE_KEY, mode); }
function persistSide(){ localStorage.setItem(SIDE_KEY, side); }

/* status: treat autodock/compacteur as OK (no control required) */
function computeRowStatus(rec){
  if(!rec) return 'bad';
  if(rec.type && rec.type !== 'normal') return 'good';
  // depending on mode, consider only relevant checks
  if(mode === 'calles'){
    return (rec.calles_both_present && rec.chains_ok) ? 'good' : 'bad';
  }
  if(mode === 'chandelles'){
    return (rec.chandelle_present && rec.chandelle_ok) ? 'good' : 'bad';
  }
  // both
  return (rec.calles_both_present && rec.chains_ok && rec.chandelle_present && rec.chandelle_ok) ? 'good' : 'bad';
}
function statusColor(st){ return st==='good' ? getComputedStyle(document.documentElement).getPropertyValue('--good').trim() : getComputedStyle(document.documentElement).getPropertyValue('--bad').trim(); }

/* Header rendering depending on mode */
function renderHeader(){
  const leftOrder = side === 'left';
  tableHead.innerHTML = '';
  const row1 = document.createElement('tr');
  const row2 = document.createElement('tr');
  function th(html, opts={}){ const e=document.createElement('th'); e.innerHTML=html; if(opts.colSpan) e.colSpan=opts.colSpan; if(opts.rowSpan) e.rowSpan=opts.rowSpan; return e; }

  if(leftOrder){
    row1.appendChild(th(''));
    row1.appendChild(th('Quai', {rowSpan:2}));
    if(mode === 'both' || mode === 'calles'){
      row1.appendChild(th('Calles', {colSpan:2}));
    }
    if(mode === 'both' || mode === 'chandelles'){
      row1.appendChild(th('Chandelle', {colSpan:2}));
    }
    row1.appendChild(th('Commentaire', {rowSpan:2}));

    row2.appendChild(th('')); // status align
    if(mode === 'both' || mode === 'calles'){ row2.appendChild(th('Présence')); row2.appendChild(th('Chaînes')); }
    if(mode === 'both' || mode === 'chandelles'){ row2.appendChild(th('Présence')); row2.appendChild(th('Etat')); }
  } else {
    row1.appendChild(th(''));
    if(mode === 'both' || mode === 'calles') row1.appendChild(th('Calles',{colSpan:2}));
    if(mode === 'both' || mode === 'chandelles') row1.appendChild(th('Chandelle',{colSpan:2}));
    row1.appendChild(th('Commentaire',{rowSpan:2}));
    row1.appendChild(th('Quai',{rowSpan:2}));

    row2.appendChild(th(''));
    if(mode === 'both' || mode === 'calles'){ row2.appendChild(th('Présence')); row2.appendChild(th('Chaînes')); }
    if(mode === 'both' || mode === 'chandelles'){ row2.appendChild(th('Présence')); row2.appendChild(th('Etat')); }
  }

  tableHead.appendChild(row1);
  tableHead.appendChild(row2);
}

/* Row cell helpers */
function tdStatus(rec,n){
  const td = document.createElement('td');
  td.style.textAlign='center';
  const dot = document.createElement('span');
  dot.className='status-dot';
  const st = computeRowStatus(rec);
  dot.style.background = statusColor(st);
  dot.title = st==='good' ? 'OK' : 'Défaut';
  td.appendChild(dot);

  // validate toggle button
  const vbtn = document.createElement('button');
  vbtn.className='type-btn';
  vbtn.style.minWidth='34px';
  vbtn.title = rec.validated ? 'Annuler validation' : 'Valider ce quai';
  vbtn.textContent = rec.validated ? '✔' : 'Val';
  vbtn.addEventListener('click',(e)=>{ e.stopPropagation(); if(!data[n]) data[n]=makeRecord(n); data[n].validated = !data[n].validated; persist(); renderTable(); });
  td.appendChild(vbtn);

  if(rec.validated){
    const b = document.createElement('span');
    b.className='valid-badge';
    b.textContent='Validé';
    td.appendChild(b);
  }
  return td;
}

function tdQuai(n){
  const td = document.createElement('td');
  td.style.display='flex';
  td.style.alignItems='center';
  const s = document.createElement('strong');
  s.textContent = 'Q' + n;
  td.appendChild(s);

  const btn = document.createElement('button');
  btn.className='type-btn';
  const t = (data[n] && data[n].type) ? data[n].type : defaultTypeFor(n);
  btn.textContent = (t==='normal')? 'Q' : (t==='autodock' ? 'A' : 'C');

  btn.addEventListener('click', (ev)=>{
    ev.stopPropagation();
    openTypeMenu(n, btn);
  });

  td.appendChild(btn);
  return td;
}

function tdCheckbox(n,key,label){
  const td = document.createElement('td');
  td.style.textAlign='center';
  const inp = document.createElement('input');
  inp.type='checkbox'; inp.autocomplete='off';
  inp.checked = !!(data[n] && data[n][key]);
  if(data[n] && data[n].type && data[n].type !== 'normal') inp.disabled = true;
  inp.addEventListener('change', ()=>{
    if(!data[n]) data[n]=makeRecord(n);
    data[n][key] = inp.checked;
    persist();
    updateRowStatus(n);
  });
  td.appendChild(inp);
  return td;
}

function tdComment(n){
  const td = document.createElement('td');
  const wrap = document.createElement('div'); wrap.className='comment-preview';
  const span = document.createElement('span'); span.className='comment-text';
  span.textContent = (data[n] && data[n].commentaire) ? data[n].commentaire : '';
  span.title = span.textContent;
  const btn = document.createElement('button'); btn.className='btn'; btn.textContent='✎';
  btn.style.padding='4px 8px';
  btn.addEventListener('click', ()=> openCommentModal(n));
  wrap.appendChild(span); wrap.appendChild(btn); td.appendChild(wrap);
  return td;
}

/* custom type menu: fixed-position and below header z-index so it never covers titles while scrolling */
let activeTypeMenu = null;
function openTypeMenu(n, anchor){
  closeTypeMenu();
  const rect = anchor.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className='type-menu';
  menu.style.left = Math.max(8, rect.left) + 'px';
  menu.style.top = Math.min(window.innerHeight - 120, rect.bottom + 6) + 'px';
  const opts = [
    {v:'normal',t:'Quai (Normal)'},
    {v:'autodock',t:'Autodock (pas de contrôle)'},
    {v:'compacteur',t:'Compacteur (pas de contrôle)'}
  ];
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.textContent = o.t;
    b.addEventListener('click', ()=>{
      if(!data[n]) data[n]=makeRecord(n);
      data[n].type = o.v;
      // when switching to 'normal', keep current values; when switching to non-normal, we keep values but disable inputs visually
      persist();
      renderTable();
      closeTypeMenu();
    });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  activeTypeMenu = menu;
  setTimeout(()=> {
    document.addEventListener('click', onDocClickForTypeMenu);
    window.addEventListener('resize', closeTypeMenu);
    window.addEventListener('scroll', closeTypeMenu, true);
  }, 0);
}
function onDocClickForTypeMenu(e){
  if(activeTypeMenu && !activeTypeMenu.contains(e.target)) closeTypeMenu();
}
function closeTypeMenu(){
  if(activeTypeMenu){ activeTypeMenu.remove(); activeTypeMenu=null; document.removeEventListener('click', onDocClickForTypeMenu); window.removeEventListener('resize', closeTypeMenu); window.removeEventListener('scroll', closeTypeMenu, true); }
}

/* comment modal */
function openCommentModal(n){
  modalRoot.innerHTML=''; modalRoot.style.display='block'; modalRoot.setAttribute('aria-hidden','false');
  const backdrop = document.createElement('div'); backdrop.className='modal-backdrop'; backdrop.setAttribute('role','dialog'); backdrop.setAttribute('aria-modal','true');
  const modal = document.createElement('div'); modal.className='modal';
  const h = document.createElement('h3'); h.textContent=`Commentaire — Quai ${n}`;
  const ta = document.createElement('textarea'); ta.autocomplete='off'; ta.value = (data[n] && data[n].commentaire) ? data[n].commentaire : '';
  const actions = document.createElement('div'); actions.className='actions';
  const save = document.createElement('button'); save.className='btn'; save.textContent='Enregistrer';
  const cancel = document.createElement('button'); cancel.className='btn ghost'; cancel.textContent='Annuler';
  save.addEventListener('click', ()=>{
    if(!data[n]) data[n]=makeRecord(n);
    data[n].commentaire = ta.value;
    persist(); closeModal(); renderTable();
  });
  cancel.addEventListener('click', closeModal);
  actions.appendChild(cancel); actions.appendChild(save);
  modal.appendChild(h); modal.appendChild(ta); modal.appendChild(actions);
  backdrop.appendChild(modal); modalRoot.appendChild(backdrop);
  backdrop.addEventListener('click',(e)=>{ if(e.target===backdrop) closeModal(); });
  setTimeout(()=>ta.focus(),80);
}
function closeModal(){ modalRoot.innerHTML=''; modalRoot.style.display='none'; modalRoot.setAttribute('aria-hidden','true'); }

/* report in new window */
function openReportWindow(){
  const htmlReport = buildReportHtml(generateReportLines());
  // open blank window synchronously (from click)
  const w = window.open('', '_blank');
  if(!w){ alert('Pop‑up bloquée : autorisez les fenêtres pop‑up pour ce site.'); return; }
  try{
    w.document.open();
    w.document.write(htmlReport);
    w.document.close();
  }catch(e){
    // fallback: blob
    const blob = new Blob([htmlReport], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const w2 = window.open(url, '_blank');
    setTimeout(()=> URL.revokeObjectURL(url),2000);
    if(!w2) alert('Pop‑up bloquée : autorisez les fenêtres pop‑up pour ce site.');
  }
}
function buildReportHtml(lines){
  // produce a small HTML with copy button
  const safe = lines.map(l => l.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('\n');
  return `<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rapport — Calles & Chandelles</title>
    <style>body{background:#000;color:#fff;font-family:monospace;padding:14px}button{background:#111;border:1px solid #333;color:#fff;padding:8px 10px;border-radius:8px;cursor:pointer}pre{white-space:pre-wrap}</style>
    </head><body>
    <div style="margin-bottom:10px"><button id="copyBtn">📋 Copier</button></div>
    <pre id="report">${safe}</pre>
    <script>
      document.getElementById('copyBtn').addEventListener('click', async ()=>{
        try{ await navigator.clipboard.writeText(document.getElementById('report').innerText); const b=document.getElementById('copyBtn'); b.textContent='✅ Copié'; setTimeout(()=>b.textContent='📋 Copier',1200); } catch(e){ alert('Impossible de copier : '+e); }
      });
    <\/script>
    </body></html>`;
}

/* generate report lines (array of strings) formatted as requested */
function generateReportLines(){
  const quays = getQuays().slice().sort((a,b)=>a-b); // ascending
  const lines = [];
  lines.push('Compte rendu — Calles & Chandelles');
  lines.push('Généré le : ' + new Date().toLocaleString('fr-FR'));
  lines.push('--------------------------------------------');

  let any=false;
  quays.forEach(n=>{
    const r = data[n] || makeRecord(n);
    if(r.type && r.type !== 'normal') return; // skip autodock/compacteur
    const issues = [];
    if(mode==='both' || mode==='calles'){
      if(!r.calles_both_present) issues.push('Calles manquantes');
      if(!r.chains_ok) issues.push('Chaînes cassées');
    }
    if(mode==='both' || mode==='chandelles'){
      if(!r.chandelle_present) issues.push('Chandelle absente');
      else if(!r.chandelle_ok) issues.push('Chandelle endommagée');
    }
    const hasComment = r.commentaire && r.commentaire.trim();
    if(issues.length===0 && !hasComment) return;
    any=true;
    lines.push('---');
    lines.push(`Quai ${n} :`);
    issues.forEach(i => lines.push(i));
    if(hasComment) lines.push(r.commentaire.trim());
    lines.push('---');
  });

  if(!any) lines.push('Aucun problème détecté et aucun commentaire (hors autodock/compacteur).');
  return lines;
}

/* rendering rows according to mode */
function renderTable(){
  renderHeader();
  while(tableBody.firstChild) tableBody.removeChild(tableBody.firstChild);
  const q = getQuays().slice();
  const ordered = (side==='left') ? q.slice().reverse() : q;
  ordered.forEach(n=>{
    const rec = data[n] || makeRecord(n);
    const tr = document.createElement('tr');
    tr.id = 'row-'+n;
    const statusTd = tdStatus(rec,n);
    const quaiTd = tdQuai(n);

    // compute which columns to include
    const cells = [];
    cells.push(statusTd);
    if(side==='left') cells.push(quaiTd);

    if(mode==='both' || mode==='calles'){
      cells.push(tdCheckbox(n,'calles_both_present'));
      cells.push(tdCheckbox(n,'chains_ok'));
    }
    if(mode==='both' || mode==='chandelles'){
      cells.push(tdCheckbox(n,'chandelle_present'));
      cells.push(tdCheckbox(n,'chandelle_ok'));
    }

    if(side!=='left') cells.push(quaiTd); // put quai at end in right order
    cells.push(tdComment(n));

    // disable checkboxes for autodock/compacteur
    if(rec.type && rec.type !== 'normal'){
      cells.forEach(td=>{
        const inp = td.querySelector && td.querySelector('input');
        if(inp) inp.disabled=true;
      });
    }

    cells.forEach(c => tr.appendChild(c));
    tableBody.appendChild(tr);
  });
}

function updateRowStatus(n){
  const tr = document.getElementById('row-'+n);
  if(!tr) return;
  const dot = tr.querySelector('.status-dot');
  if(dot){
    const st = computeRowStatus(data[n]);
    dot.style.background = statusColor(st);
    dot.title = st==='good' ? 'OK' : 'Défaut';
  }
}

/* controls */
modeSelect.addEventListener('change', ()=>{
  mode = modeSelect.value;
  persistMode();
  renderTable();
});
startBtn.addEventListener('click', ()=>{
  // show a small confirm modal summarizing selected mode
  const m = mode==='both' ? 'Calles + Chandelles' : (mode==='calles' ? 'Uniquement Calles' : 'Uniquement Chandelles');
  if(!confirm(`Démarrer le contrôle en mode : ${m} ?`)) return;
  // nothing else needed; mode already applied
  alert('Mode appliqué : ' + m);
});

genBtn.addEventListener('click', ()=> {
  // open report in new window
  openReportWindow();
});

resetBtn.addEventListener('click', ()=>{
  if(!confirm('Réinitialiser toutes les données ?')) return;
  getQuays().forEach(n => data[n] = makeRecord(n));
  persist();
  renderTable();
});

/* init */
function loadInitial(){
  try{ const raw = localStorage.getItem(DATA_KEY); if(raw) data = JSON.parse(raw); }catch(e){}
  if(!data) data={};
  getQuays().forEach(n => { if(!data[n]) data[n] = makeRecord(n); if(!data[n].type) data[n].type = defaultTypeFor(n); if(typeof data[n].validated==='undefined') data[n].validated=false; });
}
loadInitial();
renderTable();

/* close menus on unload */
window.addEventListener('beforeunload', ()=> closeTypeMenu());

</script>
</body>
</html>
