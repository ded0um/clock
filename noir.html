<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Écran noir</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    cursor: default; /* pointeur visible */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<script>
// --- Wake Lock : empêche la mise en veille tant que la page est ouverte ---
let wakeLock = null;

async function demanderWakeLock() {
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch (e) { /* non supporté ou refusé */ }
}

function libererWakeLock() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
}

// Redemande le verrou quand la page redevient visible (il est libéré automatiquement en arrière-plan)
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') demanderWakeLock();
});

if ('wakeLock' in navigator) demanderWakeLock();
window.addEventListener('beforeunload', libererWakeLock);

// --- Clic simple : bascule plein écran (comme une vidéo) ---
document.addEventListener('click', () => {
    if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
    } else {
        document.documentElement.requestFullscreen().catch(() => {});
    }
});

// Échap quitte le plein écran (comportement natif), rien à faire de plus
</script>
</body>
</html>
