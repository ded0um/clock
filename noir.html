<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Écran noir</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    cursor: default; /* pointeur visible */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>
<script>
// Page volontairement vide. Double-tap (invisible) = retour à l'horloge.
let dernierTap = 0;
document.addEventListener('pointerup', () => {
    const t = Date.now();
    if (t - dernierTap < 350) location.href = './';
    dernierTap = t;
});
</script>
</body>
</html>
