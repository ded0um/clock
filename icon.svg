<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la bordure orange 3D -->
    <linearGradient id="orange-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3b"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Dégradé pour le fond sombre -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d32"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>

    <!-- Dégradé pour les aiguilles -->
    <linearGradient id="orange-needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa44"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>

    <!-- Ombre interne pour l'effet de profondeur -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Anneau extérieur Orange (Bordure circulaire) -->
  <circle cx="256" cy="256" r="240" fill="url(#orange-border)"/>

  <!-- Fond intérieur sombre -->
  <circle cx="256" cy="256" r="204" fill="url(#bg-gradient)" filter="url(#inner-shadow)"/>

  <!-- Cercle blanc du cadran -->
  <circle cx="256" cy="225" r="130" fill="none" stroke="#ffffff" stroke-width="14"/>

  <!-- Repères horaires (Index orange) -->
  <!-- 12h, 3h, 6h, 9h -->
  <rect x="249" y="108" width="14" height="22" rx="7" fill="#ff7700"/>
  <rect x="366" y="218" width="22" height="14" rx="7" fill="#ff7700"/>
  <rect x="249" y="320" width="14" height="22" rx="7" fill="#ff7700"/>
  <rect x="124" y="218" width="22" height="14" rx="7" fill="#ff7700"/>

  <!-- Index secondaires -->
  <rect x="312" y="122" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(30 322 127)"/>
  <rect x="354" y="164" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(60 364 169)"/>
  <rect x="354" y="276" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(120 364 281)"/>
  <rect x="312" y="318" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(150 322 323)"/>
  <rect x="180" y="318" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(210 190 323)"/>
  <rect x="138" y="276" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(240 148 281)"/>
  <rect x="138" y="164" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(300 148 169)"/>
  <rect x="180" y="122" width="20" height="10" rx="5" fill="#ff7700" transform="rotate(330 190 127)"/>

  <!-- Aiguille des heures (courte) -->
  <line x1="256" y1="225" x2="195" y2="180" stroke="url(#orange-needle)" stroke-width="18" stroke-linecap="round"/>

  <!-- Aiguille des minutes (longue) -->
  <line x1="256" y1="225" x2="330" y2="165" stroke="url(#orange-needle)" stroke-width="18" stroke-linecap="round"/>

  <!-- Centre des aiguilles -->
  <circle cx="256" cy="225" r="14" fill="#ff8800" stroke="#d65100" stroke-width="3"/>

  <!-- Engrenage à 6 heures -->
  <g transform="translate(256, 285)">
    <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#ff7700"/>
    <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#ff7700" transform="rotate(45)"/>
    <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#ff7700" transform="rotate(90)"/>
    <rect x="-4" y="-20" width="8" height="40" rx="2" fill="#ff7700" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="15" fill="#ff7700"/>
    <circle cx="0" cy="0" r="7" fill="#1d1f23"/>
  </g>

  <!-- Texte DEDOUM -->
  <text x="256" y="405" 
        text-anchor="middle" 
        font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-weight="800" 
        font-size="44" 
        letter-spacing="3" 
        fill="#ffffff">DEDOUM</text>
</svg>
