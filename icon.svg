<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ombre portée douce sous le conteneur principal -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond principal arrondi (Squircle / App Icon) avec bordure orange -->
  <rect x="32" y="32" width="448" height="448" rx="90" ry="90" 
        fill="#1a1c20" stroke="#ff7700" stroke-width="10" filter="url(#drop-shadow)"/>

  <!-- Cadran circulaire blanc de l'horloge -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="#ffffff" stroke-width="16"/>

  <!-- Index horaires (Tirets orange) -->
  <!-- 12h, 3h, 6h, 9h (Grands tirets) -->
  <line x1="256" y1="96" x2="256" y2="114" stroke="#ff7700" stroke-width="10" stroke-linecap="round"/>
  <line x1="380" y1="220" x2="362" y2="220" stroke="#ff7700" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="344" x2="256" y2="326" stroke="#ff7700" stroke-width="10" stroke-linecap="round"/>
  <line x1="132" y1="220" x2="150" y2="220" stroke="#ff7700" stroke-width="10" stroke-linecap="round"/>

  <!-- Index secondaires (1h, 2h, 4h, 5h, 7h, 8h, 10h, 11h) -->
  <line x1="318" y1="112" x2="310" y2="127" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="364" y1="158" x2="349" y2="166" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="364" y1="282" x2="349" y2="274" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="318" y1="328" x2="310" y2="313" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="194" y1="328" x2="202" y2="313" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="148" y1="282" x2="163" y2="274" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="148" y1="158" x2="163" y2="166" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>
  <line x1="194" y1="112" x2="202" y2="127" stroke="#ff7700" stroke-width="8" stroke-linecap="round"/>

  <!-- Aiguille des heures (courte, orientée à 10h) -->
  <line x1="256" y1="220" x2="190" y2="170" stroke="#ff7700" stroke-width="16" stroke-linecap="round"/>

  <!-- Aiguille des minutes (longue, orientée à 2h) -->
  <line x1="256" y1="220" x2="335" y2="155" stroke="#ff7700" stroke-width="16" stroke-linecap="round"/>

  <!-- Point central des aiguilles -->
  <circle cx="256" cy="220" r="14" fill="#ff7700"/>

  <!-- Engrenage situé à 6 heures -->
  <g transform="translate(256, 280)">
    <!-- Dents de l'engrenage -->
    <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700"/>
    <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700" transform="rotate(45)"/>
    <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700" transform="rotate(90)"/>
    <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700" transform="rotate(135)"/>
    <!-- Corps central de l'engrenage avec trou au milieu -->
    <circle cx="0" cy="0" r="18" fill="#ff7700"/>
    <circle cx="0" cy="0" r="8" fill="#1a1c20"/>
  </g>

  <!-- Texte DEDOUM en blanc -->
  <text x="256" y="422" 
        text-anchor="middle" 
        font-family="'Montserrat', 'Arial Black', sans-serif" 
        font-weight="900" 
        font-size="46" 
        letter-spacing="2" 
        fill="#ffffff">DEDOUM</text>
</svg>
