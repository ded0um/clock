<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ff8c00" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Fond Noir Pur -->
  <rect width="512" height="512" rx="112" fill="#000000" />
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#222222" stroke-width="2" />

  <!-- Lettre D (Dedoum) -->
  <g>
    <path d="M 140 120 L 250 120 A 136 136 0 0 1 250 392 L 140 392 Z" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="18" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- GRANDE AIGUILLE (Minutes - 12h) : pointe vers le haut -->
    <line x1="240" y1="256" x2="240" y2="150" 
          stroke="#ff8c00" 
          stroke-width="7" 
          stroke-linecap="round" />

    <!-- PETITE AIGUILLE (Heures - 14h) : pointe vers 2h -->
    <line x1="240" y1="256" x2="295" y2="224" 
          stroke="#ff8c00" 
          stroke-width="11" 
          stroke-linecap="round" />

    <!-- Centre de l'horloge -->
    <circle cx="240" cy="256" r="8" fill="#ff8c00" />
  </g>
</svg>
