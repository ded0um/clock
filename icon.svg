<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour la bordure orange -->
    <linearGradient id="orange-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9d3b"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>

    <!-- Dégradé pour le fond sombre -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2d32"/>
      <stop offset="100%" stop-color="#111215"/>
    </linearGradient>

    <!-- Dégradé pour les aiguilles -->
    <linearGradient id="orange-needle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffaa44"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>

    <!-- Ombre interne -->
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="5" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

 
 
   <!-- Fond plein derrière le cercle : même couleur que le fond intérieur.
       Il couvre tout le carré pour qu'aucun lanceur ne puisse jamais afficher
       de blanc, quel que soit le masque appliqué (cercle, carré arrondi, etc.). -->
  <rect width="512" height="512" fill="#111215"/>
 
 
  <!-- 2. CONTENU AGRANDI POUR TOUCHER LE BORD DU MASQUE -->
  <g transform="translate(256, 256) scale(0.78) translate(-256, -256)">
    <!-- Anneau extérieur Orange (au bord exact) -->
    <circle cx="256" cy="256" r="256" fill="url(#orange-border)"/>

    <!-- Fond intérieur sombre -->
    <circle cx="256" cy="256" r="240" fill="url(#bg-gradient)" filter="url(#inner-shadow)"/>

    <!-- Cadran blanc -->
    <circle cx="256" cy="215" r="160" fill="none" stroke="#ffffff" stroke-width="16"/>

    <!-- Repères horaires principaux -->
    <rect x="248" y="70" width="16" height="26" rx="8" fill="#ff7700"/>
    <rect x="389" y="207" width="26" height="16" rx="8" fill="#ff7700"/>
    <rect x="248" y="334" width="16" height="26" rx="8" fill="#ff7700"/>
    <rect x="97" y="207" width="26" height="16" rx="8" fill="#ff7700"/>

    <!-- Repères horaires secondaires -->
    <rect x="325" y="87" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(30 336 93)"/>
    <rect x="375" y="137" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(60 386 143)"/>
    <rect x="375" y="277" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(120 386 283)"/>
    <rect x="325" y="327" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(150 336 333)"/>
    <rect x="165" y="327" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(210 176 333)"/>
    <rect x="115" y="277" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(240 126 283)"/>
    <rect x="115" y="137" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(300 126 143)"/>
    <rect x="165" y="87" width="22" height="12" rx="6" fill="#ff7700" transform="rotate(330 176 93)"/>

    <!-- Aiguilles -->
    <line x1="256" y1="215" x2="180" y2="160" stroke="url(#orange-needle)" stroke-width="20" stroke-linecap="round"/>
    <line x1="256" y1="215" x2="348" y2="140" stroke="url(#orange-needle)" stroke-width="20" stroke-linecap="round"/>
    <circle cx="256" cy="215" r="16" fill="#ff8800" stroke="#d65100" stroke-width="3"/>

    <!-- Engrenage -->
    <g transform="translate(256, 288)">
      <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700"/>
      <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700" transform="rotate(45)"/>
      <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700" transform="rotate(90)"/>
      <rect x="-5" y="-24" width="10" height="48" rx="3" fill="#ff7700" transform="rotate(135)"/>
      <circle cx="0" cy="0" r="18" fill="#ff7700"/>
      <circle cx="0" cy="0" r="8" fill="#1d1f23"/>
    </g>

    <!-- Texte DEDOUM -->
    <text x="256" y="442" 
          text-anchor="middle" 
          font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" 
          font-size="54" 
          letter-spacing="4" 
          fill="#ffffff">DEDOUM</text>
  </g>
</svg>
